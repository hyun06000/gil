<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic Notes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card">
  <h1>합성 메모장</h1>
  <p class="lead">이 페이지는 시험용 가상 화면이다. 실제 서비스가 아니다.</p>
  <div class="toolbar">
    <button type="button">새 메모 만들기</button>
    <button type="button">선택한 메모 공유</button>
    <button type="button">보관함으로 이동</button>
    <button type="button" class="danger">모두 삭제</button>
  </div>
  <ul class="notes">
    <li>장보기 목록 — 우유, 달걀, 식빵</li>
    <li>회의 메모 — 다음 주 월요일 10시</li>
    <li>아이디어 — 좁은 화면에서도 버튼이 보여야 한다</li>
  </ul>
</main>
</body>
</html>
