<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIL Monitor</title>
  <style>/* GIL Companion — 공용 UI bundle 의 겉모습.
 *
 * 계보: Codex Plugin UI 시제품(`widget.html`, 2026-09-08 실측)의 색·타이포·DAG 배치를
 * 출발점으로 삼았다. 그때의 fixture 전용 모양에서 Project switcher·현재 Cycle 확대·
 * Step detail·scope 격리를 위해 구조를 다시 짰다.
 *
 * **Tauri 를 모른다.** 이 파일에는 Host 이름이 한 번도 나오지 않는다. */

:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: light-dark(#fafaf8, #1b1d1b);
  color: light-dark(#202320, #ecefec);
}
button, select { font: inherit; color: inherit; }

/* ── 머리 ─────────────────────────────────────────────────────────── */
.top {
  height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 9px;
  border-bottom: 1px solid light-dark(#e0e3de, #363936);
}
/* 표식은 **소문자 `gil` 워드마크**다. 단독 대문자 `G` 는 쓰지 않는다 — 어느 회사의
   표식으로 오인될 자리를 남기지 않는다. 앱 아이콘·menu bar 표식과 같은 글자다.

   27px 상자에 세 글자를 넣으려고 자간을 조금 좁힌다. `l` 의 키와 `g` 의 꼬리가 상자에
   닿지 않도록 글자 크기는 11px 에 둔다. */
.mark {
  /* **줄어들지 않는다.** flex 자식이라 머리줄이 좁아지면 상자가 눌리고, 그러면 세 글자가
     잘린다(좁은 창에서 27px 이 13px 까지 눌리는 것을 시험이 잡았다). */
  flex: none;
  width: 27px; height: 27px; border-radius: 8px; background: #566fe8; color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 11px; letter-spacing: -0.2px; line-height: 1;
}
/* 이름은 **한 줄**이다. 자리가 모자라면 잘리는 대신 말줄임으로 물러선다 — 좁은 창에서
   글자가 한 자씩 쌓이면 읽을 수 없다. */
.title { min-width: 0; overflow: hidden; }
.title b, .title small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title b { display: block; font-size: 12px; }
.title small { display: block; margin-top: 2px; font-size: 9px; color: #5670e8; }

/* Project switcher — 명시적 scope 전환. 추측하지 않는다. */
/* 손잡이들은 **줄어들지 않는다.** 눌리면 글자가 세로로 쌓인다. */
.scope { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.scope label { font-size: 9px; color: light-dark(#777d77, #a9afa9); text-transform: uppercase;
               letter-spacing: .08em; }
.scope select {
  border: 1px solid light-dark(#d5d9d3, #424642); border-radius: 7px;
  background: light-dark(#fff, #252825); padding: 6px 9px; font-size: 10px; cursor: pointer;
  max-width: 230px; min-width: 0;
}

/* ── 지금 ─────────────────────────────────────────────────────────── */
.intro { padding: 14px; }
.intro small { font-size: 9px; color: light-dark(#777d77, #a9afa9); text-transform: uppercase;
               letter-spacing: .08em; }
.intro h1 { font-size: 14px; line-height: 1.4; margin: 5px 0 4px; }
.intro p { margin: 0; font-size: 10px; color: light-dark(#747a74, #a9afa9); }
.intro .world { display: inline-block; margin-top: 6px; padding: 2px 7px; border-radius: 6px;
                font-size: 9px; border: 1px solid light-dark(#d5d9d3, #424642); }

/* ── Step DAG — 기본 화면 ─────────────────────────────────────────── */
.map { margin: 0 14px; padding: 0; border: 1px solid light-dark(#dee1dc, #373b37);
       background: light-dark(#fff, #202320); overflow: auto; max-height: 52vh; }
.stage { position: relative; }
.stage .wires, .stage .arrow { position: absolute; left: 0; top: 0; pointer-events: none; }
.stage .layer { position: absolute; inset: 0; }
.stage .cards { position: absolute; inset: 0; pointer-events: none; }

.edge { fill: none; stroke: light-dark(#a9b0a9, #626962); stroke-width: 1.6; }
.edge.revisit { stroke: #c8645b; stroke-dasharray: 4 3; stroke-width: 1.6; }
.head.revisit { fill: #c8645b; }

/* Step node — 작은 원. 고른 것도 카드로 키우지 않고 강조만 더한다(§6.1-1). */
.node {
  position: absolute; transform: translate(-50%, -50%); padding: 0; cursor: pointer;
  border-radius: 50%; background: light-dark(#fff, #252825);
}
.node.step { width: 13px; height: 13px; border: 2px solid var(--kind, #9aa29a); }
.node.step[data-here="true"] { box-shadow: 0 0 0 3px rgba(86, 111, 232, .22); }
.node.step[aria-selected="true"] { width: 19px; height: 19px; border-width: 3px;
                                   border-color: #566fe8; z-index: 3; }
.node:focus-visible { outline: 2px solid #566fe8; outline-offset: 3px; }

/* Step kind 의 색 — **보조 수단이다.** 뜻은 aria-label 과 요약 카드가 진다(§6.1-5). */
.node.step[data-kind="question"], .node.step[data-kind="hypothesis"] { --kind: #566fe8; }
.node.step[data-kind="interpretation"], .node.step[data-kind="verify"] { --kind: #2f9e6e; }
.node.step[data-kind="define"], .node.step[data-kind="analysis"] { --kind: #c98a2f; }
.node.step[data-kind="synthesis"], .node.step[data-kind="outcome"] { --kind: #9a5bc0; }

/* 접힌 Cycle — 조금 더 큰 원 하나에 식별자(§6.1-8). */
.node.cycle {
  width: 26px; height: 26px; border: 2px dashed light-dark(#9aa29a, #6b726b);
  font-size: 8px; font-weight: 700; letter-spacing: -.02em; z-index: 2;
}
.node.cycle[data-verdict="failure"] { border-color: #c8645b; }
.node.cycle[aria-selected="true"] { border-color: #566fe8; border-style: solid; }

/* Cycle report hit target is behind Step nodes; fold remains independent. */
.bound {
  position: absolute; border: 1px dashed light-dark(#c9cfc8, #4a504a); border-radius: 8px;
  pointer-events: none;
}
.cycle-report-hit { position:absolute; inset:0; width:100%; height:100%; border:0;
  border-radius:7px; background:transparent; cursor:pointer; pointer-events:auto; padding:0; }
.cycle-report-hit:hover { background:#566fe80c; }
.cycle-report-hit[aria-selected="true"] { outline:2px solid #566fe8; background:#566fe810; }
.cycle-report-hit:focus-visible { outline:2px solid #566fe8; outline-offset:2px; }
.bound[data-relation="revisit_source"], .bound[data-relation="abandoned"],
.bound[data-relation="other"] { border-color: light-dark(#dfc4c1, #6b4f4c); }
/* 이름은 왼쪽 위, control 은 오른쪽 위. 식별자가 길어져도 서로 닿지 않게 이름이 쓸 수
   있는 폭을 control 앞까지로 묶는다 — 전체 이름은 `title` 이 지닌다. */
.bound-name { position: absolute; left: 4px; top: -9px; font-size: 8px; font-weight: 700;
              padding: 0 3px; background: light-dark(#fff, #202320);
              color: light-dark(#6f756f, #9aa09a);
              max-width: calc(100% - 30px); overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
/* 접기 control 은 **경계 안쪽**에 앉는다.

   상자 밖으로 걸치면 열과 열 사이의 좁은 틈(COL_W − BOX_W = 14px)을 먹어, 되돌아감
   점선이 지나는 통로가 버튼 아래로 숨는다(2026-09-11 실측). 통로를 비키게 하거나
   점선을 버튼 위로 올려 덮지 않고, **control 을 제자리로 들인다.**

   3px 은 focus ring 까지 경계 안에 드는 **가장 작은** 값이다 — 2px 이면 ring 이 점선을
   1px 넘는다(`outline: 2px` + `outline-offset: 2px` = 바깥으로 4px). */
.fold {
  position: absolute; right: 3px; top: -11px; width: 18px; height: 18px; line-height: 1;
  border-radius: 50%; border: 1px solid light-dark(#c9cfc8, #4a504a);
  background: light-dark(#fff, #252825); font-size: 11px; cursor: pointer;
  pointer-events: auto; display: grid; place-items: center; padding: 0; z-index: 4;
}
.fold:hover { border-color: #566fe8; }
.fold:focus-visible { outline: 2px solid #566fe8; outline-offset: 2px; }

/* Horizontal Cycle labels/controls are BELOW the nodes, leaving the upward
   return legs clear even for a one-Step Cycle. Focus rings fit inside the box. */
.map[data-orientation="horizontal"] .bound-name { top: 39px; }
.map[data-orientation="horizontal"] .fold { top: 36px; }

/* 고른 node 옆의 짧은 요약 카드 — **pointer event 를 가로채지 않는다**(§6.1-6). */
.card {
  position: absolute; width: 186px; pointer-events: none; z-index: 5;
  border: 1px solid light-dark(#d1d5cf, #444944); border-radius: 9px;
  background: light-dark(#fffffff2, #252825f2); padding: 7px 8px;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
}
.card small { display: block; font-size: 8px; color: #566fe8; }
.card b { display: block; margin-top: 2px; font-size: 10px; }
.card p { margin: 4px 0 0; font-size: 9px; line-height: 1.4;
          color: light-dark(#656b65, #b9beb9); }
/* 굵고 반투명한 파란 화살표 — 어느 node 의 설명인지 곧바로 보이게. */
.card-indicator { opacity: .45; }
.lead { fill: none; stroke: #566fe8; stroke-width: 5; stroke-linecap: butt; }
.lead-head { fill: #566fe8; }

/* ── 고른 것의 상세 ───────────────────────────────────────────────── */
/* 고르개 옆의 손잡이 둘. 읽기만 하는 것들이라 강조하지 않는다. */
.scope .open, .scope .refresh, .scope .forget, .scope .connect-codex, .scope .update {
  flex: none; white-space: nowrap; margin-left: 6px; padding: 4px 8px; font-size: 10px; cursor: pointer;
  border: 1px solid light-dark(#d5d9d3, #424642); border-radius: 7px;
  background: light-dark(#fff, #252825); color: inherit;
}
.scope .open:hover, .scope .refresh:hover, .scope .forget:hover, .scope .connect-codex:hover, .scope .update:hover { border-color: #566fe8; }
.scope .open:disabled, .scope .refresh:disabled, .scope .forget:disabled, .scope .connect-codex:disabled, .scope .update:disabled { opacity: .5; cursor: wait; }
.scope .open:focus-visible, .scope .refresh:focus-visible, .scope .forget:focus-visible,
.scope .connect-codex:focus-visible, .scope .update:focus-visible {
  outline: 2px solid #566fe8; outline-offset: 2px;
}

/* **마지막으로 확인된 화면**이라는 사실. Graph 를 지우는 대신 옆에 선다(§9.1.1-6). */
.stale { display: none; margin: 0 14px; padding: 7px 9px; border-radius: 8px;
         font-size: 10px; line-height: 1.45;
         border: 1px solid light-dark(#e4c98f, #6b5a2e);
         background: light-dark(#fff8e8, #2d2819);
         color: light-dark(#7a6320, #e7d49b); }
.stale[data-shown="true"] { display: block; }

/* 지금 무엇을 기다리는가. **Graph 를 가리지 않는다** — 위에 한 줄로 선다. */
.working { display: none; margin: 0 14px; padding: 6px 9px; border-radius: 8px;
           font-size: 10px; line-height: 1.45;
           border: 1px solid light-dark(#d5d9d3, #424642);
           background: light-dark(#f4f6f3, #22251f);
           color: light-dark(#6f756f, #aeb4ae); }
.working[data-shown="true"] { display: flex; gap: 7px; align-items: center; }
.working::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
  border: 2px solid #566fe8; border-right-color: transparent;
  animation: gil-turn .7s linear infinite;
}
@keyframes gil-turn { to { transform: rotate(360deg); } }
/* 움직임을 줄이라고 한 사람에게는 돌지 않는 점 하나로 족하다. */
@media (prefers-reduced-motion: reduce) {
  .working::before { animation: none; border-right-color: #566fe8; opacity: .5; }
}

/* 설정을 읽지 못했다 — 원본은 그대로 두고 이번 실행만 임시로 돈다. */
.settings-say { display: none; margin: 0 14px 8px; padding: 7px 9px; border-radius: 8px;
                font-size: 10px; line-height: 1.45;
                border: 1px solid light-dark(#e4c98f, #6b5a2e);
                background: light-dark(#fff8e8, #2d2819);
                color: light-dark(#7a6320, #e7d49b); }
.settings-say[data-shown="true"] { display: block; }

/* 못 여는 Project — 목록에 남기되 그렇다고 말한다. */
.scope select option[data-unavailable] { color: light-dark(#a8534a, #d59089); }

.empty { margin: 18px 14px; padding: 14px; border-radius: 10px;
         border: 1px dashed light-dark(#d5d9d3, #424642);
         font-size: 11px; line-height: 1.6; }
.empty p { margin: 0; }
.empty .how { margin-top: 4px; color: light-dark(#747a74, #a9afa9); }

.detail { margin: 12px 14px 0; border-top: 1px solid light-dark(#e0e3de, #343734);
          padding: 12px 0; }
.detail small { font-size: 9px; color: #566fe8; }
.detail h2 { font-size: 13px; margin: 5px 0; }
.detail dl { margin: 6px 0 0; font-size: 10px; }
.detail dt { font-weight: 700; margin-top: 6px; }
.detail dd { margin: 2px 0 0; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
             color: light-dark(#656b65, #b9beb9); }
.detail .empty { font-size: 10px; color: light-dark(#8b918b, #949a94); }

/* ── 상태 ─────────────────────────────────────────────────────────── */
.status {
  margin-top: 12px; padding: 10px 14px; border-top: 1px solid light-dark(#e0e3de, #343734);
  display: flex; gap: 7px; align-items: center; font-size: 9px;
  color: light-dark(#6f756f, #aeb4ae);
}
.status i { width: 7px; height: 7px; border-radius: 50%; background: #39a56d; }
.notice { display: none; padding: 7px 14px; background: light-dark(#fff3d9, #483d25);
          font-size: 9px; color: light-dark(#735a1d, #ead28f); }
.notice[data-shown="true"] { display: block; }

.host-bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--line, #8885); font:14px system-ui; }
.host-bar button { font:inherit; padding:7px 11px; border:1px solid #8885; border-radius:8px;
  color:inherit; background:transparent; cursor:pointer; }
.host-bar #expand { background:#5268ef; color:white; border-color:transparent; }
.host-bar button:disabled { opacity:.45; cursor:default; }
.host-bar #host-say { flex-basis:100%; }
.host-bar pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
body[data-display-mode="fullscreen"] .map { max-height:55vh; min-height:220px; }
/* Host owns the chat composer. The Monitor never draws or intercepts another chat UI. */
body[data-display-mode="fullscreen"] {
  /* The Host's overlaid composer is outside this iframe; we cannot measure its
     DOM. Reserve scrollable tail space, not a fixed overlay or a shorter Report.
     The bounded viewport-based allowance also works when no inset is advertised. */
  --gil-composer-space: calc(clamp(200px, 28vh, 320px) + env(safe-area-inset-bottom, 0px));
  padding-bottom: var(--gil-composer-space);
}
body[data-display-mode="fullscreen"] .detail { scroll-margin-bottom: var(--gil-composer-space); }
.report-visuals { border-top:1px solid #8885; margin-top:24px; padding-top:12px; overflow-wrap:anywhere; }
.report-visuals button { margin:4px; padding:8px 12px; font:inherit; cursor:pointer; }
.report-visuals figure { margin:16px 0; }
.report-visuals img { display:block; max-width:100%; max-height:65vh; object-fit:contain; }
.report-visuals figcaption { font-weight:600; margin-top:10px; white-space:pre-wrap; }
.report-visuals p { white-space:pre-wrap; }
.report-visuals .visual-viewport { max-width:100%; overflow:auto; }
.report-visuals .visual-image-trigger { display:block; margin:0; padding:0; border:0; background:transparent; max-width:100%; cursor:zoom-in; }
.report-visuals .visual-viewport.is-original { max-height:75vh; overscroll-behavior:contain; }
.report-visuals .is-original .visual-image-trigger { max-width:none; width:max-content; cursor:zoom-out; }
.report-visuals .is-original img { max-width:none; max-height:none; width:auto; height:auto; }
.report-visuals .visual-image-trigger:focus-visible, .report-visuals .visual-viewport:focus-visible { outline:2px solid currentColor; outline-offset:-2px; }
</style>
</head>
<body><section class="host-bar" aria-label="Monitor 표시 모드">
    <b>GIL Monitor</b><button id="expand" disabled>모니터 펼치기</button>
    <button id="inline" disabled>대화 안으로</button><button id="layout" disabled>세로로 보기</button>
    <button id="native" disabled>별도 창 열기</button>
    <span id="host-say" role="status">MCP Apps 연결 중…</span>
    <details><summary>연결 정보</summary><pre id="host-evidence"></pre></details>
  </section>
<main id="gil-companion">
  <header class="top">
    <div class="mark">gil</div>
    <div class="title"><b>GIL Monitor</b><small>현재 여정 · read only</small></div>
    <div class="scope">
      <label for="scope">Project</label>
      <select id="scope"></select>
      <button class="open" type="button" hidden>폴더 열기</button>
      <button class="refresh" type="button" title="완전한 View 를 다시 읽는다">새로고침</button>
      <button class="forget" type="button" hidden>목록에서 빼기</button>
      <button class="connect-codex" type="button" hidden>Codex 연결</button>
      <button class="update" type="button" hidden>업데이트 확인</button>
    </div>
  </header>
  <div class="notice"></div>
  <!-- 마지막으로 검증된 View 가 최신이 아닐 수 있다는 사실. 화면을 지우지 않는다. -->
  <div class="stale" role="status"></div>
  <!-- 지금 무엇을 기다리는가. 기다리는 동안에도 아래 Graph 는 그대로 있다. -->
  <div class="working" role="status" aria-live="polite"></div>
  <!-- 이 창의 설정을 읽지 못했다. 이번 실행은 아무것도 적지 않는다(§9.1.2). -->
  <div class="settings-say" role="status"></div>
  <div class="empty" hidden>
    <p>아직 연 Project 가 없다.</p>
    <p class="how">위의 <b>폴더 열기</b>로 GIL Project 의 root 를 고른다.</p>
  </div>
  <section class="intro" hidden>
    <small>지금</small>
    <h1></h1>
    <p></p>
    <span class="world"></span>
  </section>
  <section class="map" aria-label="Step DAG" hidden>
    <div class="stage">
      <svg class="wires" aria-hidden="true"></svg>
      <div class="layer"></div>
      <div class="cards" aria-hidden="true"></div>
    </div>
  </section>
  <section class="detail" aria-live="polite" hidden></section>
  <footer class="status"><i></i><span></span></footer>
