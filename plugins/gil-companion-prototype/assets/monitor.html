<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIL Monitor</title>
  <style>/* GIL Companion — 공용 UI bundle 의 겉모습.
 *
 * 계보: Codex Plugin UI 시제품(`widget.html`, 2026-09-08 실측)의 DAG 배치를 출발점으로 삼아
 * Project switcher·현재 Cycle 확대·Step detail·scope 격리를 위해 구조를 다시 짰다.
 * 2026-11-01: 색·글꼴·모서리·그림자를 토큰 계층으로 옮겼다.
 *
 * **Host 를 모른다.** 이 파일에는 Host 이름이 한 번도 나오지 않는다. 대신 MCP Apps 표준
 * 테마 변수(`--color-*`, `--font-*`, `--border-radius-*`, `--shadow-*`)가 문서에 있으면 그것을
 * 우선 쓰고, 없으면 아래 중립 기본값으로 돈다. 기본값은 어느 Host 옆에서도 튀지 않는 무채색과
 * 시스템 글꼴이다. Step kind 의 색은 의미를 지니므로 Host 의 info·success·warning 계열에 맞추고,
 * 표준 세트에 없는 synthesis·outcome 의 보라만 GIL 고유값으로 둔다. 기하(node 크기, 간격,
 * 화살표)는 토큰화 전과 같다. */

:root {
  color-scheme: light dark;
  --gil-bg: var(--color-background-primary, light-dark(#ffffff, #1e1e1e));
  --gil-bg-2: var(--color-background-secondary, light-dark(#f4f4f4, #272727));
  --gil-fg: var(--color-text-primary, light-dark(#1a1a1a, #f2f2f2));
  --gil-fg-2: var(--color-text-secondary, light-dark(#454545, #c3c3c3));
  --gil-fg-3: var(--color-text-tertiary, light-dark(#6f6f6f, #9b9b9b));
  --gil-line: var(--color-border-secondary, light-dark(rgba(0, 0, 0, .22), rgba(255, 255, 255, .26)));
  --gil-line-soft: var(--color-border-tertiary, light-dark(rgba(0, 0, 0, .12), rgba(255, 255, 255, .14)));
  --gil-ring: var(--color-ring-primary, light-dark(rgba(26, 26, 26, .6), rgba(242, 242, 242, .6)));
  --gil-kind-question: var(--color-border-info, #4682d5);
  --gil-kind-verify: var(--color-border-success, light-dark(#3f7a2a, #5f9a3c));
  --gil-kind-analysis: var(--color-border-warning, light-dark(#8a6420, #b38530));
  --gil-kind-synthesis: light-dark(#8a5bb8, #a47acb);
  --gil-danger: var(--color-border-danger, light-dark(#a73d39, #cd5c58));
  --gil-ok: var(--color-text-success, light-dark(#2f7a3a, #6ab06f));
  --gil-warn-bg: var(--color-background-warning, light-dark(#fbf3e3, #3d3320));
  --gil-warn-fg: var(--color-text-warning, light-dark(#6b4f14, #e3c67a));
  --gil-warn-line: var(--color-border-warning, light-dark(#c9a45c, #7d6630));
  --gil-font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  --gil-mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
  --gil-xs: var(--font-text-xs-size, 12px);
  --gil-sm: var(--font-text-sm-size, 13px);
  --gil-md: var(--font-text-md-size, 14px);
  --gil-lg: var(--font-heading-md-size, 16px);
  --gil-w-medium: var(--font-weight-medium, 500);
  --gil-w-semibold: var(--font-weight-semibold, 600);
  --gil-r-sm: var(--border-radius-sm, 6px);
  --gil-r-md: var(--border-radius-md, 8px);
  --gil-r-lg: var(--border-radius-lg, 10px);
  --gil-hair: var(--border-width-regular, 1px);
  --gil-shadow: var(--shadow-sm, 0 1px 3px 0 rgba(0, 0, 0, .1), 0 1px 2px -1px rgba(0, 0, 0, .1));
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--gil-font);
  font-size: var(--gil-sm);
  line-height: 1.4;
  background: var(--gil-bg);
  color: var(--gil-fg);
}
button, select { font: inherit; color: inherit; }

/* ── 머리 ─────────────────────────────────────────────────────────── */
.top {
  min-height: 44px; padding: 6px 16px; display: flex; align-items: center; gap: 10px;
  border-bottom: var(--gil-hair) solid var(--gil-line-soft);
}
/* 표식은 **소문자 `gil` 워드마크**다. 단독 대문자 `G` 는 쓰지 않는다 — 어느 회사의
   표식으로 오인될 자리를 남기지 않는다. 앱 아이콘·menu bar 표식과 같은 글자다.
   27px 상자에 세 글자를 넣으려고 자간을 조금 좁힌다. `l` 의 키와 `g` 의 꼬리가 상자에
   닿지 않도록 글자 크기는 11px 에 둔다. 색은 바탕의 한 단계 어두운 면이다 — 강조색이 아니다. */
.mark {
  /* **줄어들지 않는다.** flex 자식이라 머리줄이 좁아지면 상자가 눌리고, 그러면 세 글자가 잘린다. */
  flex: none;
  width: 27px; height: 27px; border-radius: var(--gil-r-md); background: var(--gil-bg-2); color: var(--gil-fg);
  display: grid; place-items: center;
  font-weight: 700; font-size: 11px; letter-spacing: -0.2px; line-height: 1;
}
/* 이름은 **한 줄**이다. 자리가 모자라면 잘리는 대신 말줄임으로 물러선다. */
.title { min-width: 0; overflow: hidden; }
.title b, .title small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title b { display: block; font-size: var(--gil-md); font-weight: var(--gil-w-semibold); }
.title small { display: block; margin-top: 1px; font-size: var(--gil-xs); color: var(--gil-fg-3); }

/* Project switcher — 명시적 scope 전환. 추측하지 않는다. 손잡이들은 **줄어들지 않는다.** */
.scope { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.scope label { font-size: var(--gil-xs); color: var(--gil-fg-3); }
.scope select {
  border: var(--gil-hair) solid var(--gil-line); border-radius: var(--gil-r-md);
  background: var(--gil-bg); color: var(--gil-fg-2); padding: 5px 9px; font-size: var(--gil-xs); cursor: pointer;
  max-width: 230px; min-width: 0;
}
/* 고르개 옆의 손잡이들. 읽기만 하는 것들이라 강조하지 않는다 — 윤곽선만 있는 ghost 단추다. */
.scope button {
  flex: none; white-space: nowrap; padding: 4px 9px; font-size: var(--gil-xs); cursor: pointer;
  border: var(--gil-hair) solid var(--gil-line); border-radius: var(--gil-r-md);
  background: transparent; color: var(--gil-fg-2);
}
.scope button:hover { border-color: var(--gil-fg-3); color: var(--gil-fg); }
.scope button:disabled { opacity: .5; cursor: default; }
.scope button:focus-visible, .scope select:focus-visible { outline: 2px solid var(--gil-ring); outline-offset: 2px; }

/* ── 지금 ─────────────────────────────────────────────────────────── */
.intro { padding: 14px 16px 0; }
.intro small { font-size: var(--gil-xs); color: var(--gil-fg-3); }
.intro h1 { font-size: var(--gil-lg); line-height: 1.3; margin: 4px 0 4px; font-weight: var(--gil-w-semibold); }
.intro p { margin: 0; font-size: var(--gil-sm); color: var(--gil-fg-2); }
.intro .world { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: var(--gil-r-sm);
                font-size: var(--gil-xs); color: var(--gil-fg-2); border: var(--gil-hair) solid var(--gil-line); }

/* ── Step DAG — 기본 화면 ─────────────────────────────────────────── */
.gil-progress { margin-top: 12px; padding: 12px 14px; background: var(--gil-bg-2);
  border-radius: var(--gil-r-lg); overflow-wrap: anywhere; }
.gil-progress strong { font-size: var(--gil-sm); font-weight: var(--gil-w-semibold); }
.gil-progress dl { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 10px; margin: 8px 0; font-size: var(--gil-sm); }
.gil-progress dt { color: var(--gil-fg-3); }
.gil-progress dd { margin: 0; white-space: pre-wrap; color: var(--gil-fg); }
.intro .gil-progress p { margin-top: 5px; font-size: var(--gil-xs); color: var(--gil-fg-3); }
.intro .gil-progress small { display: block; margin-top: 8px; }
.map { margin: 12px 16px 0; padding: 0; border: var(--gil-hair) solid var(--gil-line-soft); border-radius: var(--gil-r-lg);
       background: var(--gil-bg); overflow: auto; max-height: 52vh; }
.stage { position: relative; }
.stage .wires, .stage .arrow { position: absolute; left: 0; top: 0; pointer-events: none; }
.stage .layer { position: absolute; inset: 0; }
.stage .cards { position: absolute; inset: 0; pointer-events: none; }

.edge { fill: none; stroke: var(--gil-line); stroke-width: 1.6; }
.edge.revisit { stroke: var(--gil-danger); stroke-dasharray: 4 3; stroke-width: 1.6; }
.head.revisit { fill: var(--gil-danger); }

/* Step node — 작은 원. 고른 것도 카드로 키우지 않고 강조만 더한다(§6.1-1). */
.node {
  position: absolute; transform: translate(-50%, -50%); padding: 0; cursor: pointer;
  border-radius: 50%; background: var(--gil-bg);
}
.node.step { width: 13px; height: 13px; border: 2px solid var(--kind, var(--gil-line)); }
.node.step[data-here="true"] { box-shadow: 0 0 0 3px var(--gil-line-soft); }
.node.step[aria-selected="true"] { width: 19px; height: 19px; border-width: 3px;
                                   border-color: var(--gil-fg); z-index: 3; }
.node:focus-visible { outline: 2px solid var(--gil-ring); outline-offset: 3px; }

/* Step kind 의 색 — **보조 수단이다.** 뜻은 aria-label 과 요약 카드가 진다(§6.1-5). */
.node.step[data-kind="question"], .node.step[data-kind="hypothesis"] { --kind: var(--gil-kind-question); }
.node.step[data-kind="interpretation"], .node.step[data-kind="verify"] { --kind: var(--gil-kind-verify); }
.node.step[data-kind="define"], .node.step[data-kind="analysis"] { --kind: var(--gil-kind-analysis); }
.node.step[data-kind="synthesis"], .node.step[data-kind="outcome"] { --kind: var(--gil-kind-synthesis); }

/* 접힌 Cycle — 조금 더 큰 원 하나에 식별자(§6.1-8). */
.node.cycle {
  width: 26px; height: 26px; border: 2px dashed var(--gil-line); color: var(--gil-fg-2);
  font-size: 8px; font-weight: 700; letter-spacing: -.02em; z-index: 2;
}
.node.cycle[data-verdict="failure"] { border-color: var(--gil-danger); }
.node.cycle[aria-selected="true"] { border-color: var(--gil-fg); border-style: solid; }

/* Cycle report hit target is behind Step nodes; fold remains independent. */
.bound {
  position: absolute; border: var(--gil-hair) dashed var(--gil-line); border-radius: var(--gil-r-md);
  pointer-events: none;
}
.cycle-report-hit { position:absolute; inset:0; width:100%; height:100%; border:0;
  border-radius:7px; background:transparent; cursor:pointer; pointer-events:auto; padding:0; }
.cycle-report-hit:hover { background: var(--gil-bg-2); }
.cycle-report-hit[aria-selected="true"] { outline: 2px solid var(--gil-fg); background: var(--gil-bg-2); }
.cycle-report-hit:focus-visible { outline: 2px solid var(--gil-ring); outline-offset: 2px; }
.bound[data-relation="revisit_source"], .bound[data-relation="abandoned"],
.bound[data-relation="other"] { border-color: color-mix(in srgb, var(--gil-danger) 55%, transparent); }
/* 이름은 왼쪽 위, control 은 오른쪽 위. 식별자가 길어져도 서로 닿지 않게 이름이 쓸 수
   있는 폭을 control 앞까지로 묶는다 — 전체 이름은 `title` 이 지닌다. */
.bound-name { position: absolute; left: 4px; top: -9px; font-size: 10px; font-weight: var(--gil-w-medium);
              line-height: 1.2; padding: 0 3px; background: var(--gil-bg); color: var(--gil-fg-3);
              max-width: calc(100% - 30px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 접기 control 은 **경계 안쪽**에 앉는다(2026-09-11 실측). 3px 은 focus ring 까지 경계 안에
   드는 가장 작은 값이다. */
.fold {
  position: absolute; right: 3px; top: -11px; width: 18px; height: 18px; line-height: 1;
  border-radius: 50%; border: var(--gil-hair) solid var(--gil-line);
  background: var(--gil-bg); color: var(--gil-fg-2); font-size: 11px; cursor: pointer;
  pointer-events: auto; display: grid; place-items: center; padding: 0; z-index: 4;
}
.fold:hover { border-color: var(--gil-fg-3); color: var(--gil-fg); }
.fold:focus-visible { outline: 2px solid var(--gil-ring); outline-offset: 2px; }

/* Horizontal Cycle labels/controls are BELOW the nodes, leaving the upward
   return legs clear even for a one-Step Cycle. Focus rings fit inside the box. */
.map[data-orientation="horizontal"] .bound-name { top: 39px; }
.map[data-orientation="horizontal"] .fold { top: 36px; }

/* 고른 node 옆의 짧은 요약 카드 — **pointer event 를 가로채지 않는다**(§6.1-6). */
.card {
  position: absolute; width: 186px; pointer-events: none; z-index: 5;
  border: var(--gil-hair) solid var(--gil-line); border-radius: var(--gil-r-md);
  background: var(--gil-bg); padding: 8px 10px;
  box-shadow: var(--gil-shadow);
}
.card small { display: block; font-size: var(--gil-xs); color: var(--gil-fg-3); }
.card b { display: block; margin-top: 2px; font-size: var(--gil-sm); font-weight: var(--gil-w-semibold); }
.card p { margin: 4px 0 0; font-size: var(--gil-xs); line-height: 1.4; color: var(--gil-fg-2); }
/* 굵고 반투명한 화살표 — 어느 node 의 설명인지 곧바로 보이게. 글자색 계열이라 어느 테마에도 든다. */
.card-indicator { opacity: .45; }
.lead { fill: none; stroke: var(--gil-fg-3); stroke-width: 5; stroke-linecap: butt; }
.lead-head { fill: var(--gil-fg-3); }

/* **마지막으로 확인된 화면**이라는 사실. Graph 를 지우는 대신 옆에 선다(§9.1.1-6). */
.stale { display: none; margin: 12px 16px 0; padding: 8px 10px; border-radius: var(--gil-r-md);
         font-size: var(--gil-xs); line-height: 1.45;
         border: var(--gil-hair) solid var(--gil-warn-line);
         background: var(--gil-warn-bg); color: var(--gil-warn-fg); }
.stale[data-shown="true"] { display: block; }

/* 지금 무엇을 기다리는가. **Graph 를 가리지 않는다** — 위에 한 줄로 선다. */
.working { display: none; margin: 12px 16px 0; padding: 7px 10px; border-radius: var(--gil-r-md);
           font-size: var(--gil-xs); line-height: 1.45;
           border: var(--gil-hair) solid var(--gil-line-soft);
           background: var(--gil-bg-2); color: var(--gil-fg-3); }
.working[data-shown="true"] { display: flex; gap: 7px; align-items: center; }
.working::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none;
  border: 2px solid var(--gil-fg-3); border-right-color: transparent;
  animation: gil-turn .7s linear infinite;
}
@keyframes gil-turn { to { transform: rotate(360deg); } }
/* 움직임을 줄이라고 한 사람에게는 돌지 않는 점 하나로 족하다. */
@media (prefers-reduced-motion: reduce) {
  .working::before { animation: none; border-right-color: var(--gil-fg-3); opacity: .5; }
}

/* 설정을 읽지 못했다 — 원본은 그대로 두고 이번 실행만 임시로 돈다. */
.settings-say { display: none; margin: 12px 16px 0; padding: 8px 10px; border-radius: var(--gil-r-md);
                font-size: var(--gil-xs); line-height: 1.45;
                border: var(--gil-hair) solid var(--gil-warn-line);
                background: var(--gil-warn-bg); color: var(--gil-warn-fg); }
.settings-say[data-shown="true"] { display: block; }

/* 못 여는 Project — 목록에 남기되 그렇다고 말한다. */
.scope select option[data-unavailable] { color: var(--gil-danger); }

.empty { margin: 18px 16px; padding: 14px; border-radius: var(--gil-r-lg);
         border: var(--gil-hair) dashed var(--gil-line);
         font-size: var(--gil-sm); line-height: 1.6; }
.empty p { margin: 0; }
.empty .how { margin-top: 4px; color: var(--gil-fg-3); }

.detail { margin: 12px 16px 0; border-top: var(--gil-hair) solid var(--gil-line-soft);
          padding: 12px 0; }
.detail small { font-size: var(--gil-xs); color: var(--gil-fg-3); }
.detail h2 { font-size: var(--gil-lg); font-weight: var(--gil-w-semibold); margin: 4px 0 6px; }
.detail dl { margin: 6px 0 0; font-size: var(--gil-sm); }
.detail dt { font-weight: var(--gil-w-semibold); margin-top: 10px; color: var(--gil-fg); }
.detail dd { margin: 3px 0 0; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
             color: var(--gil-fg-2); }
.detail .empty { font-size: var(--gil-sm); color: var(--gil-fg-3); }

/* ── 상태 ─────────────────────────────────────────────────────────── */
.status {
  margin-top: 12px; padding: 10px 16px; border-top: var(--gil-hair) solid var(--gil-line-soft);
  display: flex; gap: 8px; align-items: center; font-size: var(--gil-xs);
  color: var(--gil-fg-3);
}
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--gil-ok); flex: none; }
.notice { display: none; padding: 7px 16px; background: var(--gil-warn-bg);
          font-size: var(--gil-xs); color: var(--gil-warn-fg); }
.notice[data-shown="true"] { display: block; }

/* Host 가 그리는 카드 안에서 한 겹만 더한다: 머리줄 오른쪽의 보조 손잡이(#layout·#native 는
   companion.css 의 `.scope button` 을 그대로 입는다)와, 맨 아래의 표시 모드 줄. 제목은 Host 카드와
   머리줄이 이미 말하므로 여기서 되풀이하지 않는다. 색·글꼴은 모두 companion.css 의 토큰이다. */
.host-bar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:8px 16px 10px;
  border-top: var(--gil-hair) solid var(--gil-line-soft); font-size: var(--gil-xs); color: var(--gil-fg-3); }
.host-bar #host-say { flex: 1 1 240px; min-width: 0; line-height: 1.45; }
.host-bar button { font: inherit; padding:4px 9px; border: var(--gil-hair) solid var(--gil-line);
  border-radius: var(--gil-r-md); color: var(--gil-fg-2); background: transparent; cursor:pointer; white-space: nowrap; }
.host-bar button:hover { border-color: var(--gil-fg-3); color: var(--gil-fg); }
.host-bar button:disabled { opacity:.45; cursor:default; }
.host-bar button:focus-visible, .host-bar summary:focus-visible { outline: 2px solid var(--gil-ring); outline-offset: 2px; }
.host-bar details { flex-basis: 100%; }
.host-bar summary { cursor: pointer; width: max-content; }
.host-bar pre { white-space:pre-wrap; overflow-wrap:anywhere; margin: 6px 0 0;
  font: var(--gil-xs)/1.45 var(--gil-mono); color: var(--gil-fg-2); }
body[data-display-mode="fullscreen"] .map { max-height:55vh; min-height:220px; }
/* Host owns the chat composer. The Monitor never draws or intercepts another chat UI. */
body[data-display-mode="fullscreen"] {
  /* The Host's overlaid composer is outside this iframe; we cannot measure its
     DOM. Reserve scrollable tail space, not a fixed overlay or a shorter Report.
     The bounded viewport-based allowance also works when no inset is advertised. */
  --gil-composer-space: calc(clamp(200px, 28vh, 320px) + env(safe-area-inset-bottom, 0px));
  padding-bottom: var(--gil-composer-space);
}
body[data-display-mode="fullscreen"] .detail { scroll-margin-bottom: var(--gil-composer-space); }
/* 펼친 화면이 넓으면 Report 를 오른쪽 패널로 세운다. DOM 순서와 wire 는 그대로다 — 자리만 바뀐다. */
@media (min-width: 900px) {
  body[data-display-mode="fullscreen"] #gil-companion {
    display: grid; grid-template-columns: minmax(0, 1fr) 380px; align-content: start;
    grid-template-areas: "top top" "notice notice" "stale stale" "working working" "settings settings"
      "empty empty" "intro detail" "map detail" "status status" "plan plan" "bar bar";
  }
  body[data-display-mode="fullscreen"] .top { grid-area: top; }
  body[data-display-mode="fullscreen"] .notice { grid-area: notice; }
  body[data-display-mode="fullscreen"] .stale { grid-area: stale; }
  body[data-display-mode="fullscreen"] .working { grid-area: working; }
  body[data-display-mode="fullscreen"] .settings-say { grid-area: settings; }
  body[data-display-mode="fullscreen"] .empty { grid-area: empty; }
  body[data-display-mode="fullscreen"] .intro { grid-area: intro; }
  body[data-display-mode="fullscreen"] .map { grid-area: map; align-self: start; }
  body[data-display-mode="fullscreen"] .detail { grid-area: detail; align-self: start; margin: 14px 16px 0 0;
    padding: 0 0 0 20px; border-top: 0; border-left: var(--gil-hair) solid var(--gil-line-soft); }
  body[data-display-mode="fullscreen"] .status { grid-area: status; }
  body[data-display-mode="fullscreen"] .host-bar { grid-area: bar; }
}
.report-visuals { border-top: var(--gil-hair) solid var(--gil-line-soft); margin-top:24px; padding-top:12px; overflow-wrap:anywhere; }
.report-visuals button { margin:4px; padding:6px 10px; font:inherit; font-size: var(--gil-xs); cursor:pointer;
  border: var(--gil-hair) solid var(--gil-line); border-radius: var(--gil-r-md); background: transparent; color: var(--gil-fg-2); }
.report-visuals figure { margin:16px 0; }
.report-visuals img { display:block; max-width:100%; max-height:65vh; object-fit:contain; border-radius: var(--gil-r-sm); }
.report-visuals figcaption { font-weight: var(--gil-w-semibold); margin-top:10px; white-space:pre-wrap; }
.report-visuals p { white-space:pre-wrap; }
.report-visuals .visual-viewport { max-width:100%; overflow:auto; }
.report-visuals .visual-image-trigger { display:block; margin:0; padding:0; border:0; background:transparent; max-width:100%; cursor:zoom-in; }
.report-visuals .visual-viewport.is-original { max-height:75vh; overscroll-behavior:contain; }
.report-visuals .is-original .visual-image-trigger { max-width:none; width:max-content; cursor:zoom-out; }
.report-visuals .is-original img { max-width:none; max-height:none; width:auto; height:auto; }
.report-visuals .visual-image-trigger:focus-visible, .report-visuals .visual-viewport:focus-visible { outline:2px solid currentColor; outline-offset:-2px; }

/* The approval panel is an MCP-only action surface, separate from the shared read model. */
.plan-review { grid-area:plan; padding:16px; border-top:var(--gil-hair) solid var(--gil-line); overflow-wrap:anywhere; }
.plan-review[hidden] { display:none; }
.plan-review h2 { font-size:var(--gil-md); }
.plan-review dt { font-weight:600; margin-top:10px; }
.plan-review dd { margin:4px 0; white-space:pre-wrap; }
.plan-review li, .plan-review pre { white-space:pre-wrap; overflow-wrap:anywhere; }
.plan-review button { margin:8px 12px 0 0; padding:9px 14px; border:1px solid var(--gil-line); border-radius:6px; color:var(--gil-fg); background:var(--gil-bg); cursor:pointer; }
.plan-review button:focus-visible { outline:2px solid var(--gil-ring); outline-offset:3px; }
.plan-review button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<main id="gil-companion">
  <header class="top">
    <div class="mark">gil</div>
    <div class="title"><b>GIL Monitor</b><small class="runtime">현재 여정 · read only</small></div>
    <div class="scope">
      <label for="scope">Project</label>
      <select id="scope"></select>
      <button class="open" type="button" hidden>폴더 열기</button>
      <button class="refresh" type="button" title="완전한 View 를 다시 읽는다">새로고침</button>
      <button id="layout" type="button" disabled>세로로 보기</button>
      <button id="native" type="button" disabled>별도 창 열기</button>
      <button class="forget" type="button" hidden>목록에서 빼기</button>
      <button class="connect-codex" type="button" hidden>Codex 연결</button>
      <button class="update" type="button" hidden>업데이트 확인</button>
    </div>
  </header>
  <div class="notice"></div>
  <!-- 마지막으로 검증된 View 가 최신이 아닐 수 있다는 사실. 화면을 지우지 않는다. -->
  <div class="stale" role="status"></div>
  <!-- 지금 무엇을 기다리는가. 기다리는 동안에도 아래 Graph 는 그대로 있다. -->
  <div class="working" role="status" aria-live="polite"></div>
  <!-- 이 창의 설정을 읽지 못했다. 이번 실행은 아무것도 적지 않는다(§9.1.2). -->
  <div class="settings-say" role="status"></div>
  <div class="empty" hidden>
    <p>아직 연 Project 가 없다.</p>
    <p class="how">위의 <b>폴더 열기</b>로 GIL Project 의 root 를 고른다.</p>
  </div>
  <section class="intro" hidden>
    <small>지금</small>
    <h1></h1>
    <p></p>
    <span class="world"></span>
    <section class="gil-progress" aria-label="GIL 기록 진행">
      <strong class="progress-position"></strong>
      <dl><dt>지금 할 일</dt><dd class="progress-action"></dd>
        <dt>완료 조건</dt><dd class="progress-done"></dd></dl>
      <p class="progress-records"></p>
      <p class="progress-observed"></p>
      <p class="progress-connection" role="status"></p>
      <small>GIL에 기록된 상태입니다. 에이전트의 생각이나 다른 도구 사용 여부는 여기서 확인할 수 없습니다.</small>
    </section>
  </section>
  <section class="map" aria-label="Step DAG" hidden>
    <div class="stage">
      <svg class="wires" aria-hidden="true"></svg>
      <div class="layer"></div>
      <div class="cards" aria-hidden="true"></div>
    </div>
  </section>
  <section class="detail" aria-live="polite" hidden></section>
  <footer class="status"><i></i><span></span></footer>
  <section id="plan-review" class="plan-review" aria-label="사용자 계획 승인" aria-live="polite" hidden></section>
  <section class="host-bar" aria-label="Monitor 표시 모드">
    <span id="host-say" role="status">MCP Apps 연결 중…</span>
    <button id="expand" type="button" disabled>모니터 펼치기</button>
    <button id="inline" type="button" disabled>대화 안으로</button>
    <details><summary>연결 정보</summary><pre id="host-evidence"></pre></details>
  </section>
</main>
