name: Temporary CI build-setting experiment (not for merge)
on:
  push:
    branches: [claude/ci-build-settings-experiment]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    defaults:
      run:
        # The Chain job's own Windows shell: under Git Bash the ACL-deny test in tests/mcp.rs
        # did not see permission_denied (first experiment run).
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo fetch --locked
      - name: Debuginfo x incremental, one feature group, no cache save
        run: node tools/ci-experiment/build-settings.mjs
