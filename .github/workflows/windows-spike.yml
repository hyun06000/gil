name: Windows native spike
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_candidate:
        description: 'Build unsigned review artifacts for every matrix entry (profile-labeled); never publish or install'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-native:
    name: Windows native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            profile: default
            label: x64
            runner: windows-2025
            machine: AMD64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            profile: default
            label: arm64
            runner: windows-11-arm
            machine: ARM64
            target: aarch64-pc-windows-msvc
          # Image-report authoring profile (Windows contract v0.1 §6). Never packaged here.
          - arch: x64
            profile: visual-authoring
            label: x64, visual-authoring
            runner: windows-2025
            machine: AMD64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            profile: visual-authoring
            label: arm64, visual-authoring
            runner: windows-11-arm
            machine: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      GIL_NATIVE_TARGET: ${{ matrix.target }}
      GIL_NATIVE_MACHINE: ${{ matrix.machine }}
      GIL_NATIVE_ARCH: ${{ matrix.arch }}
      GIL_RUNTIME_PROFILE: ${{ matrix.profile }}
      # The runner's own user hive may carry a GilTest sync-root registration during the test.
      GIL_TEST_REAL_REGISTRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Automatic installer target detection
        shell: powershell
        run: ./distribution/windows/install-target.test.ps1
      - name: Install maintainer toolchain
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne $env:GIL_NATIVE_MACHINE) { throw 'Expected native runner architecture' }
          node -e "if (process.arch !== process.env.GIL_NATIVE_ARCH) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Node must run natively, not under emulation' }
          rustup toolchain install 1.97.1 --profile minimal --target $env:GIL_NATIVE_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target $env:GIL_NATIVE_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Packaging tests independently resolve both locked notice inventories offline.
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build embedded UI
        shell: pwsh
        run: |
          npm ci --prefix mcp-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node mcp-app/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Core and MCP for the selected profile
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } elseif ($env:GIL_RUNTIME_PROFILE -eq 'default') { @() } else { throw 'unknown profile' }
          cargo +1.97.1 build --locked -p gil --bin gil --target $env:GIL_NATIVE_TARGET @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Binding security and native MCP integration
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          cargo +1.97.1 test --locked -p gil --test windows_bindings --target $env:GIL_NATIVE_TARGET @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 test --locked -p gil --test mcp --target $env:GIL_NATIVE_TARGET @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runtime update state judge (pure; both profiles)
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          # The judge is pure (no file access, no execution); the count must show 18 executed tests.
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET @features --lib -- runtime_state::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runtime store read-only observer (isolated fixtures; both profiles)
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          # Reads only its own temp fixtures (protected-DACL root, icacls, hard links, junctions); the
          # count must show 13 executed tests (3 shared parser tests + 10 Windows fixture tests).
          # --nocapture: the ancestor-swap test prints which branch the host took (OS refused the
          # rename / re-walk blocked); the printed line is the evidence, not the pass alone.
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET @features --lib -- runtime_observe:: --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runtime store initialization and candidate preparation (isolated fixtures; both profiles)
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          # Creates its own temp stores only (protected-DACL roots, reservations, synthetic Core
          # bytes); never executes a candidate. 15 tests exist; one (linked source) is Unix-only,
          # so the count here must show 14 executed tests.
          # --nocapture: the swap/move/replace fixtures print the refusal point the host took.
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET @features --lib -- runtime_prepare:: --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runtime store selection transition (isolated fixtures; both profiles)
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          # intent → selection → history under the OS lock on temp stores only; the candidate is
          # never executed. 10 tests, none platform-conditional: the count must show 10.
          # --nocapture: the root-swap fixture prints whether the OS refused the rename or the
          # held-handle observation blocked the swapped root.
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET @features --lib -- runtime_select:: runtime_lock:: --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runtime isolated launch mechanism (synthetic cmd.exe copies; both profiles)
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          # Runs synthetic copies of cmd.exe from temp stores only (never a GIL Core). Of the 14
          # tests, 6 are shared, 6 Unix-only and 2 Windows-only: the count here must show 8.
          # --nocapture: the pin-refusal, timeout and exit-confirmation lines are the evidence.
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET @features --lib -- runtime_launch:: --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pinned Codex CLI in a runner-only prefix (no global install; integrity check, not a publisher signature)
        shell: pwsh
        env:
          GIL_CODEX_PIN: 0.163.0-alpha.11.1
          # Registry metadata read with `npm view` on 2026-10-24 (version, tarball URL, integrity,
          # platform-package aliases). npm verifies the downloaded tarballs against the registry's
          # integrity; this step compares that result with the values recorded here. Neither is a
          # verification of the publisher's signature on codex.exe.
          GIL_CODEX_MAIN_INTEGRITY: sha512-QMij7qvP91hQyLX9qxxCeraIIDlv0Mt4Cut7NolhB6xlvZjny73PH5iFQPJT+Y8XuP9ML4vC6kYy3HlqcLlaRA==
          GIL_CODEX_X64_INTEGRITY: sha512-58wBlhzI4n1eLtmvMb1mgwH1T2SaYyCrLD6HDwB0l8WI7wn4Cb17l870POeTSTLSMuDKZZbu60TpTGuM2qYHtA==
          GIL_CODEX_ARM64_INTEGRITY: sha512-U05HBXdAPTP5gHgnkyIaPT8mp5Xuf2Q6c1NVhxUK4GfOgj1TQ65Vlkj1hHNcZwZg7FLznnsCYvTBjIuKaKzPqQ==
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = $env:GIL_NATIVE_ARCH
          $prefix = Join-Path $env:RUNNER_TEMP 'codex-cli'
          New-Item -ItemType Directory -Path $prefix | Out-Null
          # Local prefix only: nothing under npm's global root, no PATH change, no lifecycle scripts.
          # npm installs the one platform package whose os/cpu match this runner (never "latest").
          npm install --prefix $prefix --no-audit --no-fund --ignore-scripts "@openai/codex@$env:GIL_CODEX_PIN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkgDir = Join-Path $prefix "node_modules\@openai\codex-win32-$arch"
          if (-not (Test-Path -LiteralPath $pkgDir -PathType Container)) { throw "platform package missing: $pkgDir" }
          $otherArch = if ($arch -eq 'x64') { 'arm64' } else { 'x64' }
          foreach ($stray in @("codex-win32-$otherArch", 'codex-linux-x64', 'codex-linux-arm64', 'codex-darwin-x64', 'codex-darwin-arm64')) {
            if (Test-Path -LiteralPath (Join-Path $prefix "node_modules\@openai\$stray")) { throw "unexpected platform package installed: $stray" }
          }
          $main = Get-Content -Raw -LiteralPath (Join-Path $prefix 'node_modules\@openai\codex\package.json') | ConvertFrom-Json
          $plat = Get-Content -Raw -LiteralPath (Join-Path $pkgDir 'package.json') | ConvertFrom-Json
          if ($main.name -ne '@openai/codex' -or $main.version -ne $env:GIL_CODEX_PIN) { throw "main package is $($main.name)@$($main.version)" }
          if ($plat.name -ne '@openai/codex' -or $plat.version -ne "$($env:GIL_CODEX_PIN)-win32-$arch" -or @($plat.os) -notcontains 'win32' -or @($plat.cpu) -notcontains $arch) { throw "platform package is $($plat.name)@$($plat.version) os=$($plat.os) cpu=$($plat.cpu)" }
          # npm records what it resolved and verified in the lockfile (the hidden one when no package-lock.json is written).
          $lockPath = @((Join-Path $prefix 'package-lock.json'), (Join-Path $prefix 'node_modules\.package-lock.json')) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $lockPath) { throw 'npm wrote no lockfile; resolved URLs and integrity cannot be checked' }
          # -AsHashtable: the lockfile's root entry is keyed by an empty name, which ConvertFrom-Json otherwise refuses.
          $lock = Get-Content -Raw -LiteralPath $lockPath | ConvertFrom-Json -AsHashtable
          $mainLock = $lock['packages']['node_modules/@openai/codex']
          $platLock = $lock['packages']["node_modules/@openai/codex-win32-$arch"]
          if (-not $mainLock -or -not $platLock) { throw "lockfile $lockPath has no entry for the main or the platform package" }
          $expectedPlat = if ($arch -eq 'x64') { $env:GIL_CODEX_X64_INTEGRITY } else { $env:GIL_CODEX_ARM64_INTEGRITY }
          if ($mainLock.resolved -ne "https://registry.npmjs.org/@openai/codex/-/codex-$($env:GIL_CODEX_PIN).tgz") { throw "main package resolved to $($mainLock.resolved)" }
          if ($mainLock.integrity -ne $env:GIL_CODEX_MAIN_INTEGRITY) { throw "main tarball integrity $($mainLock.integrity) differs from the recorded value" }
          if ($platLock.resolved -ne "https://registry.npmjs.org/@openai/codex/-/codex-$($env:GIL_CODEX_PIN)-win32-$arch.tgz") { throw "platform package resolved to $($platLock.resolved)" }
          if ($platLock.integrity -ne $expectedPlat) { throw "platform tarball integrity $($platLock.integrity) differs from the recorded value" }
          # The real executable, not npm's codex.cmd/codex.js wrapper: exactly one codex.exe in the platform package.
          $exes = @(Get-ChildItem -LiteralPath $pkgDir -Recurse -File -Filter 'codex.exe')
          if ($exes.Count -ne 1) { throw "expected exactly one codex.exe under the platform package, found $($exes.Count): $($exes.FullName -join '; ')" }
          $exe = $exes[0].FullName
          if ((Get-Item -LiteralPath $exe).LinkType) { throw 'codex.exe is a link' }
          # PE machine field: built for this runner's CPU, so the App Server does not run under emulation.
          $fs = [System.IO.File]::OpenRead($exe)
          try {
            $br = New-Object System.IO.BinaryReader($fs)
            $fs.Position = 0x3C; $peOffset = $br.ReadUInt32()
            $fs.Position = $peOffset; if ($br.ReadUInt32() -ne 0x00004550) { throw 'codex.exe is not a PE image' }
            $machine = $br.ReadUInt16()
          } finally { $fs.Dispose() }
          $expectedMachine = if ($arch -eq 'x64') { 0x8664 } else { 0xAA64 }
          if ($machine -ne $expectedMachine) { throw ('PE machine 0x{0:X4} differs from expected 0x{1:X4}' -f $machine, $expectedMachine) }
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "codex.exe --version exited $LASTEXITCODE" }
          if ($version -ne "codex-cli $($env:GIL_CODEX_PIN)") { throw "codex.exe reports '$version'" }
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE 'target\runtime-integration-evidence'
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          $evidence = Join-Path $evidenceDir "codex-cli-$arch-$($env:GIL_RUNTIME_PROFILE).json"
          [ordered]@{
            note = 'npm tarball integrity compared with registry metadata read on 2026-10-24: a download-integrity check, not a verification of the publisher signature on codex.exe'
            pin = "@openai/codex@$($env:GIL_CODEX_PIN)"
            install = 'npm install --prefix <RUNNER_TEMP>/codex-cli --no-audit --no-fund --ignore-scripts (no global install)'
            runner_image = $env:ImageOS; arch = $arch; target = $env:GIL_NATIVE_TARGET
            node = (node --version); npm = (npm --version)
            main_package = [ordered]@{ name = $main.name; version = $main.version; resolved = $mainLock.resolved; integrity = $mainLock.integrity }
            platform_package = [ordered]@{ name = $plat.name; version = $plat.version; os = @($plat.os); cpu = @($plat.cpu); resolved = $platLock.resolved; integrity = $platLock.integrity }
            codex_exe = [ordered]@{ path_under_prefix = $exe.Substring($prefix.Length).TrimStart('\'); bytes = (Get-Item -LiteralPath $exe).Length; sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant(); pe_machine = ('0x{0:X4}' -f $machine); version_output = $version }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidence -Encoding utf8
          Get-Content -LiteralPath $evidence
          "GIL_CODEX_CLI=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Runtime App Server integration (runtime-testbed feature; required; isolated CODEX_HOME and store)
        shell: pwsh
        env:
          # BLOCKED (no CLI) fails instead of returning; the test is compiled only with the feature.
          GIL_RUNTIME_INTEGRATION_REQUIRE: '1'
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { 'runtime-testbed,visual-authoring' } else { 'runtime-testbed' }
          if (-not $env:GIL_CODEX_CLI -or -not (Test-Path -LiteralPath $env:GIL_CODEX_CLI -PathType Leaf)) { throw 'GIL_CODEX_CLI must name the verified codex.exe from the previous step' }
          # A real Codex App Server over stdio with an isolated CODEX_HOME whose only MCP server is
          # the test-only launcher driver; the synthetic Cores are overlay-marked copies of the
          # testbed exe in a temp store (never a GIL Core, never the runner's own ~/.codex). 5 tests
          # must run: the main flow prints OUTCOME: PASS with the evidence path, and --nocapture
          # keeps every version/pid/instance line and the app-server stderr in this log.
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET --features $features --lib runtime_verify -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET --features $features --test runtime_integration -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pass = @(Get-ChildItem -LiteralPath target\runtime-integration-evidence -File -Filter 'run-*-PASS.json')
          if ($pass.Count -ne 1) { throw "expected one PASS evidence file from the main flow, found $($pass.Count)" }
          Get-Content -LiteralPath $pass[0].FullName
      - name: Retain runtime integration evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gil-runtime-integration-${{ matrix.arch }}-${{ matrix.profile }}-${{ github.sha }}
          path: target/runtime-integration-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Image-report storage boundaries (Windows contract v0.1 §6)
        if: matrix.profile == 'visual-authoring'
        shell: pwsh
        run: |
          cargo +1.97.1 test --locked -p gil --features visual-authoring --target $env:GIL_NATIVE_TARGET --test visual_attachment --test visual_start --test visual_store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # --nocapture: the standard-user driver prints the observed hive state and the branch it verified.
          cargo +1.97.1 test --locked -p gil --features visual-authoring --target $env:GIL_NATIVE_TARGET --test windows_ordinary_user -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 test --locked -p gil --features visual-authoring --target $env:GIL_NATIVE_TARGET --lib -- session::visual_start lock:: artifact::store visual_report:: windows_fs agent:: mcp::workspace::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native protocol, read-only Monitor and process restart
        shell: pwsh
        run: |
          node distribution/windows/spike.mjs "target/$env:GIL_NATIVE_TARGET/debug/gil.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Candidate packaging regression
        shell: pwsh
        run: |
          node --test distribution/windows/candidate.test.mjs distribution/windows/verify-bundle.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated verification bundle (test-only executables; never published or installed)
        if: matrix.profile == 'default'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          # Release build of the integration test executable + the two test-only bins, packed per
          # native CPU with bundle.json, VERIFY.md and the notices; roundtrip-checked. No product binary.
          node distribution/windows/verify-bundle.mjs target/runtime-verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Self-test of the bundle from its own archive (pinned CLI downloaded by the driver)
        if: matrix.profile == 'default'
        shell: pwsh
        run: |
          # Exactly what a user's Agent does: one new folder, extract the archive there, run the
          # driver with --root; the driver fetches the pinned CLI from the npm registry by itself.
          $name = "gil-runtime-verify-windows-$env:GIL_NATIVE_ARCH"
          $folder = Join-Path $env:RUNNER_TEMP ("gil-runtime-verify 한글 selftest-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $folder | Out-Null
          Copy-Item -LiteralPath "target/runtime-verify/$name.tar.gz" -Destination (Join-Path $folder "$name.tar.gz")
          Push-Location -LiteralPath $folder
          try {
            tar.exe -xzf "$name.tar.gz"
            if ($LASTEXITCODE -ne 0) { throw "bundle extraction failed: $LASTEXITCODE" }
            & (Join-Path $folder "$name\gil-runtime-verify.exe") --root .
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          Copy-Item -LiteralPath (Join-Path $folder 'work\evidence\verify-report.json') -Destination "target/runtime-verify/selftest-report-$env:GIL_NATIVE_ARCH.json"
          if ($code -ne 0) { throw "self-test exit $code (0 = PASS is required)" }
          $report = Get-Content -Raw -LiteralPath "target/runtime-verify/selftest-report-$env:GIL_NATIVE_ARCH.json" | ConvertFrom-Json
          if ($report.outcome -ne 'PASS' -or $report.cli.source -ne 'pinned' -or -not $report.cli.matches_ci_pin) { throw "self-test report is not a pinned PASS: $($report.outcome) $($report.cli.source)" }
      - name: Retain verification bundle (review artifact; not a release)
        if: matrix.profile == 'default' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: true
          name: gil-runtime-verify-${{ matrix.arch }}-${{ github.sha }}
          path: |
            target/runtime-verify/*.tar.gz
            target/runtime-verify/SHA256SUMS-*
            target/runtime-verify/checks-*.json
            target/runtime-verify/selftest-report-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare unsigned review candidate (profile-labeled; never published or installed)
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_candidate
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          node distribution/windows/candidate.mjs target/windows-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain review artifact only
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          archive: true
          name: gil-windows-${{ matrix.arch }}-${{ matrix.profile }}-REVIEW-${{ github.sha }}
          path: |
            target/windows-candidate/*.tar.gz
            target/windows-candidate/SHA256SUMS
            target/windows-candidate/checks.json
          if-no-files-found: error
          retention-days: 7
