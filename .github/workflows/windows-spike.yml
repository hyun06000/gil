name: Windows native Core (x64)
# What a Windows PR must prove after the 2026-11-12 single-executable decision: the native x64
# Core builds, its Windows bindings / MCP / guard / image-report boundaries hold, and the
# native protocol survives a process restart. The retired runtime-update layers (launcher,
# store observer/prepare/select/launch, App Server integration, verification bundle), the
# Windows Companion pipes and the review-candidate packaging no longer run here. ARM64 has no
# native build by decision (x64 runs under emulation); add a native job when it is requested.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'spec/gil-spec.yaml'
      - 'mcp-app/**'
      - 'ui/**'
      - 'plugins/gil-companion-prototype/assets/**'
      - 'distribution/windows/**'
      - 'distribution/compliance/**'
      - 'tools/ci/**'
      - '.github/workflows/windows-spike.yml'
  # Seed reusable default-branch dependency caches only when their inputs change.
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'companion/Cargo.toml'
      - 'mcp-app/package-lock.json'
      - 'plugins/gil-companion-prototype/package-lock.json'
      - 'tools/ci/**'
      - '.github/workflows/windows-spike.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  windows-native:
    name: Windows native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            profile: default
            label: x64
            runner: windows-2025
            machine: AMD64
            target: x86_64-pc-windows-msvc
          # Image-report authoring profile (Windows contract v0.1 §6). Never packaged here.
          - arch: x64
            profile: visual-authoring
            label: x64, visual-authoring
            runner: windows-2025
            machine: AMD64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      GIL_NATIVE_TARGET: ${{ matrix.target }}
      GIL_NATIVE_MACHINE: ${{ matrix.machine }}
      GIL_NATIVE_ARCH: ${{ matrix.arch }}
      GIL_RUNTIME_PROFILE: ${{ matrix.profile }}
      # The runner's own user hive may carry a GilTest sync-root registration during the test.
      GIL_TEST_REAL_REGISTRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore locked dependencies and compiler outputs
        id: build_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24, pinned
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/CACHEDIR.TAG
            target/debug
            target/aarch64-apple-darwin
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/plugin-core-build
          key: ${{ runner.os }}-${{ runner.arch }}-windows-spike-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-deps-v2-${{ hashFiles('.github/workflows/windows-spike.yml', 'tools/ci/prune-workspace-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-windows-spike-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-
      - name: Install maintainer toolchain
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne $env:GIL_NATIVE_MACHINE) { throw 'Expected native runner architecture' }
          node -e "if (process.arch !== process.env.GIL_NATIVE_ARCH) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Node must run natively, not under emulation' }
          rustup toolchain install 1.97.1 --profile minimal --target $env:GIL_NATIVE_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target $env:GIL_NATIVE_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The packaging tests resolve both locked Windows notice inventories offline.
          cargo fetch --locked --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build embedded UI
        shell: pwsh
        run: |
          npm ci --prefix mcp-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node mcp-app/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Core and MCP for the selected profile
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } elseif ($env:GIL_RUNTIME_PROFILE -eq 'default') { @() } else { throw 'unknown profile' }
          cargo +1.97.1 build --locked -p gil --bin gil --target $env:GIL_NATIVE_TARGET @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Binding security and native MCP integration
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          cargo +1.97.1 test --locked -p gil --test windows_bindings --target $env:GIL_NATIVE_TARGET @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 test --locked -p gil --test mcp --target $env:GIL_NATIVE_TARGET @features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Host guard scope and direct file protection (both profiles)
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET @features --test automatic_guard --test write_guard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Host registration (gil install / doctor / uninstall) on the native target
        shell: pwsh
        run: |
          $features = if ($env:GIL_RUNTIME_PROFILE -eq 'visual-authoring') { @('--features', 'visual-authoring') } else { @() }
          cargo +1.97.1 test --locked -p gil --target $env:GIL_NATIVE_TARGET @features --lib -- install::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Image-report storage boundaries (Windows contract v0.1 §6)
        if: matrix.profile == 'visual-authoring'
        shell: pwsh
        run: |
          cargo +1.97.1 test --locked -p gil --features visual-authoring --target $env:GIL_NATIVE_TARGET --test visual_attachment --test visual_start --test visual_store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # --nocapture: the standard-user driver prints the observed hive state and the branch it verified.
          cargo +1.97.1 test --locked -p gil --features visual-authoring --target $env:GIL_NATIVE_TARGET --test windows_ordinary_user -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97.1 test --locked -p gil --features visual-authoring --target $env:GIL_NATIVE_TARGET --lib -- session::visual_start lock:: artifact::store visual_report:: windows_fs agent:: mcp::workspace::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native protocol, read-only Monitor and process restart
        shell: pwsh
        run: |
          node distribution/windows/spike.mjs "target/$env:GIL_NATIVE_TARGET/debug/gil.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows distribution contracts (notice inventories, release workflow, legacy packaging)
        if: matrix.profile == 'default'
        shell: pwsh
        run: |
          node --test distribution/windows/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CI cache and ordering contracts
        if: matrix.profile == 'default'
        run: node --test tools/ci/*.test.mjs
      - name: Keep dependency outputs in cache after verification and artifact upload
        if: steps.build_cache.outputs.cache-hit != 'true'
        run: node tools/ci/prune-workspace-cache.mjs
