name: Codex native marketplace preview (NOT a release)

on:
  pull_request:
    branches: [main]
  # Seed reusable default-branch dependency caches only when their inputs change.
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'companion/Cargo.toml'
      - 'mcp-app/package-lock.json'
      - 'plugins/gil-companion-prototype/package-lock.json'
      - 'tools/ci/**'
      - '.github/workflows/codex-preview.yml'
  workflow_dispatch:
    inputs:
      unsigned_preview_version:
        description: 'Optional X.Y.Z-preview.N candidate; no publication or installation'
        required: false
        default: ''
        type: string
      runtime_profile:
        description: 'Candidate runtime contract; no automatic migration, installation or publication'
        required: true
        default: default
        type: choice
        options:
          - default
          - visual-authoring
          - approved-plan

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos-arm64-preview:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore locked dependencies and compiler outputs
        id: build_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24, pinned
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/CACHEDIR.TAG
            target/debug
            target/aarch64-apple-darwin
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/plugin-core-build
          key: ${{ runner.os }}-${{ runner.arch }}-codex-preview-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-deps-v2-${{ hashFiles('.github/workflows/codex-preview.yml', 'tools/ci/prune-workspace-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-codex-preview-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-
      - name: Check build machine (never a user installation requirement)
        run: |
          test "$(uname -m)" = arm64
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-darwin
          npm ci --prefix mcp-app
          npm ci --prefix plugins/gil-companion-prototype
          cargo fetch --locked
      - name: Core and shared UI regression for selected profile
        env:
          GIL_RUNTIME_PROFILE: ${{ inputs.runtime_profile || 'default' }}
        run: |
          # Fork-based launcher fixtures can inherit another parallel fixture's lock.
          # Keep assertions intact and run the native Core fixtures sequentially.
          case "$GIL_RUNTIME_PROFILE" in
            default) cargo test --locked -p gil -- --test-threads=1 ;;
            visual-authoring) cargo test --locked -p gil --features visual-authoring -- --test-threads=1 ;;
            approved-plan) cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --lib --test context --test context_profiles --test guidance_wave1 --test guidance_wave2 --test approved_plan_wire_wave1 -- --test-threads=1 ;;
            *) exit 2 ;;
          esac
          node --test ui/layout.test.mjs mcp-app/*.test.mjs plugins/gil-companion-prototype/*.test.mjs
      - name: Packaging regression tests
        run: node --test distribution/codex/*.test.mjs distribution/compliance/notices.test.mjs
      - name: Offline third-party license coverage (no automatic policy refresh)
        run: node distribution/compliance/notices.mjs check
      - name: Prepare fresh output parent
        run: mkdir -p target
      - name: Build embedded UI and native MCP; roundtrip and first-start checks
        env:
          GIL_RUNTIME_PROFILE: ${{ inputs.runtime_profile || 'default' }}
        run: |
          # Fork-based launcher fixtures can inherit another parallel fixture's lock.
          # Keep assertions intact and run the native Core fixtures sequentially.
          case "$GIL_RUNTIME_PROFILE" in
            default) node distribution/codex/build-preview.mjs target/codex-preview ;;
            visual-authoring) node distribution/codex/build-preview.mjs target/codex-preview --visual-authoring ;;
            approved-plan) node distribution/codex/build-preview.mjs target/codex-preview --approved-plan ;;
            *) exit 2 ;;
          esac
      - name: Prepare opt-in unsigned candidate (never publishes)
        if: github.event_name == 'workflow_dispatch' && inputs.unsigned_preview_version != ''
        env:
          GIL_PREVIEW_VERSION: ${{ inputs.unsigned_preview_version }}
          GIL_RUNTIME_PROFILE: ${{ inputs.runtime_profile || 'default' }}
        run: |
          # Fork-based launcher fixtures can inherit another parallel fixture's lock.
          # Keep assertions intact and run the native Core fixtures sequentially.
          case "$GIL_RUNTIME_PROFILE" in
            default) node distribution/codex/unsigned-preview.mjs prepare target/codex-preview/marketplace "$GIL_PREVIEW_VERSION" target/codex-unsigned-candidate ;;
            visual-authoring) node distribution/codex/unsigned-preview.mjs prepare target/codex-preview/marketplace "$GIL_PREVIEW_VERSION" target/codex-unsigned-candidate --visual-authoring ;;
            approved-plan) node distribution/codex/unsigned-preview.mjs prepare target/codex-preview/marketplace "$GIL_PREVIEW_VERSION" target/codex-unsigned-candidate --approved-plan ;;
            *) exit 2 ;;
          esac
      - name: Retain unsigned candidate for review only
        if: github.event_name == 'workflow_dispatch' && inputs.unsigned_preview_version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          archive: true
          name: gil-codex-macos-arm64-UNSIGNED-CANDIDATE-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/codex-unsigned-candidate/*.tar.gz
            target/codex-unsigned-candidate/SHA256SUMS
            target/codex-unsigned-candidate/checks.json
            target/codex-unsigned-candidate/update-record.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain development evidence only (not a marketplace publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          archive: true # Keep the tar, checksum and evidence together; not direct-file publication.
          name: gil-codex-macos-arm64-DEVELOPMENT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/codex-preview/gil-codex-macos-arm64-preview.tar.gz
            target/codex-preview/SHA256SUMS
            target/codex-preview/checks.json
          if-no-files-found: error
          retention-days: 7
      - name: CI cache and ordering contracts
        run: node --test tools/ci/*.test.mjs
      - name: Keep dependency outputs in cache after verification and artifact upload
        if: steps.build_cache.outputs.cache-hit != 'true'
        run: node tools/ci/prune-workspace-cache.mjs
