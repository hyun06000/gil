name: Chain M6-A/B/C/D development acceptance (no publication)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'spec/gil-spec.yaml'
      - 'plugins/gil-companion-prototype/skills/**'
      - 'plugins/gil-companion-prototype/*.mjs'
      - 'plugins/gil-companion-prototype/assets/**'
      - 'mcp-app/**'
      - 'ui/**'
      - 'tools/scenarios/**'
      - 'tools/chain-interview-eval/**'
      - 'tools/chain-closing-eval/**'
      - 'tools/chain-monitor-fixtures/**'
      - 'tools/manual-example-check/**'
      - 'spec/GIL_Approved_Plan_v0.1.md'
      - 'tools/chain-resume-benchmark/**'
      - 'tools/chain-context-bench/**'
      - 'design-tests/approved-item-split/**'
      - 'tools/ci/**'
      - 'scenarios/**'
      - '.github/workflows/chain-core.yml'
  # Seed reusable default-branch dependency caches only when their inputs change.
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'companion/Cargo.toml'
      - 'mcp-app/package-lock.json'
      - 'plugins/gil-companion-prototype/package-lock.json'
      - 'tools/ci/**'
      - '.github/workflows/chain-core.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
# CI-only build cost settings for the dev/test profiles (release is untouched; optimisation,
# debug assertions, overflow checks and panic strategy keep their defaults). Line tables keep
# file:line in panic backtraces but drop variable/type debuginfo; nothing here reuses the
# incremental state, so it is not written. The debuginfo value changes the cached dependency
# outputs and is part of the cache restore prefix; incremental state is never cached.
# Measured in tools/ci/CHAIN-CORE-TIMING.md. Both jobs share these values and one dependency cache.
env:
  RUSTUP_TOOLCHAIN: 1.97.1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'
defaults:
  run:
    shell: bash
# One macOS job keeps what needs macOS (tools/ci/CHAIN-CORE-TIMING.md §8): tests compiled or
# meaningful only there, tests whose result depends on OS or filesystem behaviour, the start path
# of an image-report project, the approved recovery, and the checks that read the macOS build.
# Every feature profile runs completely on Linux in `chain-linux`. Windows CI is paused.
jobs:
  chain-macos:
    name: chain macos (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore locked dependencies and compiler outputs
        id: build_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24, pinned
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/CACHEDIR.TAG
            target/debug
            target/aarch64-apple-darwin
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/plugin-core-build
          key: ${{ runner.os }}-${{ runner.arch }}-chain-core-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-dev-debug-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-deps-v2-${{ hashFiles('.github/workflows/chain-core.yml', 'tools/ci/prune-workspace-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chain-core-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-dev-debug-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-
      - name: Default Core resume capture and measurement (synthetic, no model evaluation)
        run: node tools/chain-resume-benchmark/run.mjs default "${{ runner.temp }}/gil-resume-default" target
      - name: Private visual creation unit contracts
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --lib visual_start
      - name: Private visual creation integration
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --test visual_start --test chain_resume_benchmark
      - name: Complete native MCP roundtrip
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --test mcp
      - name: Compile all Core targets in the development product profile
        run: cargo build --locked -p gil --all-targets --features chain-core,visual-authoring,product-safety
      - name: Approval profile, M6-D contract over the real stdio process (Wave 1 E wire)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test approved_plan_wire_wave1 --test chain_recovery_preservation
      - name: After a Closing approval the receipts lead to the Chain Report with the approved verdict, never to an Experiment (real stdio process, restart, change request; synthetic)
        run: node tools/ci/expect-tests.mjs 4 cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test closing_handoff
      - name: Approval profile, library contracts of the modules that touch the OS (links, permissions, locks, install, launcher, runtime, image-report storage); the complete library runs on Linux
        run: >-
          node tools/ci/expect-tests.mjs 50 cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --lib -- restore:: lock:: install:: launcher:: runtime_ visual_ internal_fs:: write_guard:: monitor::serve:: mcp::bindings:: session::format_transition:: project_resume:: companion --test-threads=1
      - name: Approval profile, resume guidance over a record that cannot be read (the next-call guidance suites run on Linux)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test resume_guidance
      - name: Manual help matches approval and recovery policies (Mac)
        if: runner.os == 'macOS'
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test manual
      - name: Approval profile resume capture and measurement (synthetic, no model evaluation)
        run: node tools/chain-resume-benchmark/run.mjs product "${{ runner.temp }}/gil-resume-product" target
      - name: Host guard scope and file protection in approval profile
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test automatic_guard --test write_guard -- --test-threads=1
      - name: Compile the opt-in approval profile
        run: cargo build --locked -p gil --all-targets --features approved-plan,visual-authoring,product-safety
      - name: Manual example contracts over the real Core (Mac, synthetic inputs)
        if: runner.os == 'macOS'
        env:
          GIL_EXAMPLE_CHECK_GIL: target/debug/gil
        run: |
          node tools/manual-example-check/check.mjs run --gil target/debug/gil --out "${{ runner.temp }}/gil-manual-examples"
          node --test tools/manual-example-check/*.test.mjs
      - name: Product context recovery measurement (Mac, synthetic approval)
        if: runner.os == 'macOS'
        env:
          CHAIN_CONTEXT_BENCH_GIL_PRODUCT: target/debug/gil
        run: node --test tools/chain-context-bench/*.test.mjs
      - name: M4-R opt-in recovery approval mode, setting parser and read-only contracts (not a product profile)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,recovery-auto-approval --lib recovery_mode
      - name: M4-R opt-in recovery approval mode over the real stdio process (5 synthetic cases, no user project)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,recovery-auto-approval --test recovery_approval_mode
      - name: Compile all Core targets with opt-in recovery approval (not a product profile)
        run: cargo build --locked -p gil --all-targets --features approved-plan,visual-authoring,recovery-auto-approval
      - name: Unachieved end over real files, the CLI and the stdio process (evidence and dirty gates kept, save failure, resend, restart, read surfaces; synthetic, no model evaluation)
        run: node tools/ci/expect-tests.mjs 7 cargo test --locked -p gil --features will-end-history --test will_end_session
      - name: Native MCP roundtrip on format 8 (the Chain, Will and context suites of this profile run on Linux)
        run: cargo test --locked -p gil --features will-end-history --test mcp
      - name: Explicit 6 to 8 transition over the real stdio process (read-only check, relayed user approval bound to project, state and proposal, copy and save failures, resend; order 1b, synthetic)
        run: node tools/ci/expect-tests.mjs 6 cargo test --locked -p gil --features will-end-history --test format_transition
      - name: Format 9 unachieved end through the typed visual close over the real stdio process (null marker refused in both shapes, resend, restart; synthetic)
        run: node tools/ci/expect-tests.mjs 1 cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --test will_end_visual
      - name: Unachieved end with product safety, the failure does not approve recovery (synthetic)
        run: node tools/ci/expect-tests.mjs 7 cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --test will_end_session
      - name: Explicit 6 to 8 and 7 to 9 transitions with the visual registry and product safety (private storage kept; order 1b, synthetic)
        run: node tools/ci/expect-tests.mjs 7 cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --test format_transition
      - name: Private visual creation, Chain handoff, attachments and the native MCP roundtrip on format 9 (synthetic)
        run: cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --test visual_start --test chain_resume_benchmark --test mcp --test chain_handoff --test visual_attachment
      - name: Shared workflow text, Skill catalog and scenario evaluator contracts (pure Node, no Core process)
        run: node --test plugins/gil-companion-prototype/skill.test.mjs plugins/gil-companion-prototype/workflow.test.mjs tools/scenarios/proxy.test.mjs tools/scenarios/redact.test.mjs tools/scenarios/report.test.mjs tools/scenarios/rpc.test.mjs tools/scenarios/scorer-cli.test.mjs tools/scenarios/trace-score.test.mjs tools/scenarios/approval-link.test.mjs tools/scenarios/state-path.test.mjs
      - name: CI cache and ordering contracts
        run: node --test tools/ci/*.test.mjs
      - name: Manual example source and reporting contracts (no Core process)
        run: node --test tools/manual-example-check/*.test.mjs
      - name: Chain interview evaluator contracts (no model evaluation)
        run: node --test tools/chain-interview-eval/*.test.mjs
      - name: Chain interview synthetic fixture integrity
        run: node tools/chain-interview-eval/check-fixtures.mjs
      - name: Chain closing evaluator and unapproved item-split model contracts
        run: node --test tools/chain-closing-eval/*.test.mjs design-tests/approved-item-split/*.test.mjs
      - name: Chain closing synthetic fixture integrity (no model evaluation)
        run: node tools/chain-closing-eval/check.mjs fixtures
      - name: Resume measurement contracts
        run: node --test tools/chain-resume-benchmark/*.test.mjs
      - name: Context growth measurement contracts (Unix process fixtures)
        if: runner.os == 'macOS'
        run: node --test tools/chain-context-bench/*.test.mjs
      - name: Keep dependency outputs in cache after verification and artifact upload
        if: steps.build_cache.outputs.cache-hit != 'true'
        run: node tools/ci/prune-workspace-cache.mjs
  # Every feature profile on Linux, one row per profile (tools/ci/CHAIN-CORE-TIMING.md §7-§8): the
  # complete library and every integration suite of the profile, except the suites that stay on
  # macOS alone (manual, automatic_guard, write_guard), the M4-R profile (tests/recovery_approval_mode.rs is compiled on
  # macOS and Windows only: the first Linux run counted 0 tests) and the Node checks that read the
  # macOS product build.
  chain-linux:
    name: chain linux (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: chain-core
            features: chain-core
            lib: none
            minimum: 5
            suites: chains chain_closing chain_handoff cycles context context_profiles will walk resume_guidance will_end_unsupported
            extra: --features chain-core --test revisit cumulative_context_survives_pending_new_branch_success_and_process_restart -- --exact
            save_cache: true
          - group: development-product
            features: chain-core,visual-authoring,product-safety
            lib: visual_start
            minimum: 3
            suites: visual_start chain_resume_benchmark mcp
          - group: approval
            features: approved-plan,visual-authoring,product-safety
            lib: all
            minimum: 14
            suites: approved_plan_wire_wave1 chain_recovery_preservation chain_monitor_fixtures closing_handoff context context_profiles guidance_wave1 guidance_wave2 guidance_interview_chain resume_guidance
          - group: exploration
            features: exploration-flow,visual-authoring,product-safety
            lib: all
            minimum: 20
            suites: exploration_flow exploration_tools exploration_evidence exploration_plan_panel closing_handoff approved_plan_wire_wave1 chain_recovery_preservation context context_profiles guidance_wave1 guidance_wave2 guidance_interview_chain resume_guidance
          - group: end-history
            features: will-end-history
            lib: all
            minimum: 33
            suites: will_end will_end_session chains chain_closing chain_handoff cycles context context_profiles will walk resume_guidance mcp tracking_record_boundary format_transition
          - group: end-history-product
            features: will-end-history,visual-authoring,product-safety
            lib: all
            minimum: 15
            suites: will_end_visual will_end_session format_transition visual_start chain_resume_benchmark mcp chain_handoff visual_attachment
            extra: --features will-end-history,approved-plan,visual-authoring,product-safety --test chain_monitor_fixtures
    env:
      FEATURES: ${{ matrix.features }}
      LIB: ${{ matrix.lib }}
      MINIMUM: ${{ matrix.minimum }}
      SUITES: ${{ matrix.suites }}
      EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore locked dependencies and compiler outputs
        id: linux_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24, pinned; restore only, one row saves below
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/CACHEDIR.TAG
            target/debug
            target/aarch64-apple-darwin
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/plugin-core-build
          key: ${{ runner.os }}-${{ runner.arch }}-chain-core-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-dev-debug-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-deps-v2-${{ hashFiles('.github/workflows/chain-core.yml', 'tools/ci/prune-workspace-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chain-core-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-dev-debug-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-
      - name: Library contracts of this profile (all, a name filter, or none as on macOS)
        if: matrix.lib != 'none'
        run: |
          set -euo pipefail
          if [ "$LIB" = all ]; then cargo test --locked -p gil --features "$FEATURES" --lib -- --test-threads=1
          else node tools/ci/expect-tests.mjs 1 cargo test --locked -p gil --features "$FEATURES" --lib "$LIB"; fi
      - name: Integration suites of this profile over real files and the real stdio process (synthetic)
        run: |
          set -euo pipefail
          tests=(); for suite in $SUITES; do tests+=(--test "$suite"); done
          # --no-fail-fast: every failing suite is reported in one run; the step still fails on any of them.
          node tools/ci/expect-tests.mjs "$MINIMUM" cargo test --locked -p gil --no-fail-fast --features "$FEATURES" "${tests[@]}"
      - name: Compile all Core targets of this profile
        run: cargo build --locked -p gil --all-targets --features "$FEATURES"
      - name: The one check of this row that uses another filter or feature set
        if: matrix.extra != ''
        run: node tools/ci/expect-tests.mjs 1 cargo test --locked -p gil $EXTRA
      - name: Keep only dependency outputs for the Linux cache (one row saves it)
        if: matrix.save_cache && steps.linux_cache.outputs.cache-hit != 'true'
        run: node tools/ci/prune-workspace-cache.mjs
      - name: Save the Linux dependency cache
        if: matrix.save_cache && steps.linux_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24, pinned
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/CACHEDIR.TAG
            target/debug
            target/aarch64-apple-darwin
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/plugin-core-build
          key: ${{ runner.os }}-${{ runner.arch }}-chain-core-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-dev-debug-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-deps-v2-${{ hashFiles('.github/workflows/chain-core.yml', 'tools/ci/prune-workspace-cache.mjs') }}
