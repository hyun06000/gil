name: Chain M6-A/B/C/D development acceptance (no publication)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'spec/gil-spec.yaml'
      - 'plugins/gil-companion-prototype/skills/**'
      - 'plugins/gil-companion-prototype/*.mjs'
      - 'plugins/gil-companion-prototype/assets/**'
      - 'mcp-app/**'
      - 'ui/**'
      - 'tools/scenarios/**'
      - 'scenarios/**'
      - '.github/workflows/chain-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            shell: bash
          - runner: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Actual Chain, legacy preservation and domain regressions
        run: cargo test --locked -p gil --features chain-core --test chains --test chain_closing --test chain_handoff --test cycles --test context --test context_profiles --test will --test walk
      - name: Repeated failure and branch context inside a Chain
        run: cargo test --locked -p gil --features chain-core --test revisit cumulative_context_survives_pending_new_branch_success_and_process_restart -- --exact
      - name: Private visual creation unit contracts
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --lib visual_start
      - name: Private visual creation integration
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --test visual_start
      - name: Complete native MCP roundtrip
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --test mcp
      - name: Compile all Core targets in the development product profile
        run: cargo build --locked -p gil --all-targets --features chain-core,visual-authoring,product-safety
      - name: Approval profile, complete library contracts (plan domain, tool catalog, guidance, profile fixtures)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --lib -- --test-threads=1
      - name: Historical context projection stays readable without automatic approval migration
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test context --test context_profiles
      - name: Approval profile, next-call guidance over in-memory state and the real receipt (Wave 1 C)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test guidance_wave1 --test guidance_wave2
      - name: Approval profile, M6-D contract over the real stdio process (Wave 1 E wire)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test approved_plan_wire_wave1
      - name: Compile the opt-in approval profile
        run: cargo build --locked -p gil --all-targets --features approved-plan,visual-authoring,product-safety
      - name: Shared workflow text, Skill catalog and scenario evaluator contracts (pure Node, no Core process)
        run: node --test plugins/gil-companion-prototype/skill.test.mjs plugins/gil-companion-prototype/workflow.test.mjs tools/scenarios/proxy.test.mjs tools/scenarios/redact.test.mjs tools/scenarios/report.test.mjs tools/scenarios/rpc.test.mjs tools/scenarios/scorer-cli.test.mjs tools/scenarios/trace-score.test.mjs tools/scenarios/approval-link.test.mjs tools/scenarios/state-path.test.mjs
