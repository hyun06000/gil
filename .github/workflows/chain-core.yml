name: Chain M6-A/B/C/D development acceptance (no publication)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'spec/gil-spec.yaml'
      - 'plugins/gil-companion-prototype/skills/**'
      - 'plugins/gil-companion-prototype/*.mjs'
      - 'plugins/gil-companion-prototype/assets/**'
      - 'mcp-app/**'
      - 'ui/**'
      - 'tools/scenarios/**'
      - 'tools/chain-interview-eval/**'
      - 'tools/chain-closing-eval/**'
      - 'tools/chain-monitor-fixtures/**'
      - 'tools/manual-example-check/**'
      - 'spec/GIL_Approved_Plan_v0.1.md'
      - 'tools/chain-resume-benchmark/**'
      - 'tools/chain-context-bench/**'
      - 'design-tests/approved-item-split/**'
      - 'tools/ci/**'
      - 'scenarios/**'
      - '.github/workflows/chain-core.yml'
  # Seed reusable default-branch dependency caches only when their inputs change.
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'companion/Cargo.toml'
      - 'mcp-app/package-lock.json'
      - 'plugins/gil-companion-prototype/package-lock.json'
      - 'tools/ci/**'
      - '.github/workflows/chain-core.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  chain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            shell: bash
          - runner: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore locked dependencies and compiler outputs
        id: build_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24, pinned
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/CACHEDIR.TAG
            target/debug
            target/aarch64-apple-darwin
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/plugin-core-build
          key: ${{ runner.os }}-${{ runner.arch }}-chain-core-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-deps-v2-${{ hashFiles('.github/workflows/chain-core.yml', 'tools/ci/prune-workspace-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-chain-core-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-
      - name: Default Core resume capture and measurement (synthetic, no model evaluation)
        run: node tools/chain-resume-benchmark/run.mjs default "${{ runner.temp }}/gil-resume-default" target
      - name: Actual Chain, legacy preservation and domain regressions
        run: cargo test --locked -p gil --features chain-core --test chains --test chain_closing --test chain_handoff --test cycles --test context --test context_profiles --test will --test walk --test resume_guidance
      - name: A build without the end history refuses formats 8 and 9 untouched and never reads an unachieved request as a close (synthetic)
        run: node tools/ci/expect-tests.mjs 3 cargo test --locked -p gil --features chain-core --test will_end_unsupported
      - name: Repeated failure and branch context inside a Chain
        run: cargo test --locked -p gil --features chain-core --test revisit cumulative_context_survives_pending_new_branch_success_and_process_restart -- --exact
      - name: Private visual creation unit contracts
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --lib visual_start
      - name: Private visual creation integration
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --test visual_start --test chain_resume_benchmark
      - name: Complete native MCP roundtrip
        run: cargo test --locked -p gil --features chain-core,visual-authoring,product-safety --test mcp
      - name: Compile all Core targets in the development product profile
        run: cargo build --locked -p gil --all-targets --features chain-core,visual-authoring,product-safety
      - name: Native Windows recovery boundaries (pinned directories, links, journal cleanup)
        if: runner.os == 'Windows'
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --lib restore::windows -- --test-threads=1
      - name: Approval profile, M6-D contract over the real stdio process (Wave 1 E wire)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test approved_plan_wire_wave1 --test chain_recovery_preservation --test chain_monitor_fixtures
      - name: After a Closing approval the receipts lead to the Chain Report with the approved verdict, never to an Experiment (real stdio process, restart, change request; synthetic)
        run: node tools/ci/expect-tests.mjs 4 cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test closing_handoff
      - name: Approval profile, complete library contracts (plan domain, tool catalog, guidance, profile fixtures)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --lib -- --test-threads=1
      - name: Historical context projection stays readable without automatic approval migration
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test context --test context_profiles
      - name: Approval profile, next-call guidance over in-memory state and the real receipt (Wave 1 C)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test guidance_wave1 --test guidance_wave2 --test guidance_interview_chain --test resume_guidance
      - name: Manual help matches approval and recovery policies (Mac)
        if: runner.os == 'macOS'
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test manual
      - name: Approval profile resume capture and measurement (synthetic, no model evaluation)
        run: node tools/chain-resume-benchmark/run.mjs product "${{ runner.temp }}/gil-resume-product" target
      - name: Host guard scope and file protection in approval profile
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,product-safety --test automatic_guard --test write_guard -- --test-threads=1
      - name: Compile the opt-in approval profile
        run: cargo build --locked -p gil --all-targets --features approved-plan,visual-authoring,product-safety
      - name: Manual example contracts over the real Core (Mac, synthetic inputs)
        if: runner.os == 'macOS'
        env:
          GIL_EXAMPLE_CHECK_GIL: target/debug/gil
        run: |
          node tools/manual-example-check/check.mjs run --gil target/debug/gil --out "${{ runner.temp }}/gil-manual-examples"
          node --test tools/manual-example-check/*.test.mjs
      - name: Product context recovery measurement (Mac, synthetic approval)
        if: runner.os == 'macOS'
        env:
          CHAIN_CONTEXT_BENCH_GIL_PRODUCT: target/debug/gil
        run: node --test tools/chain-context-bench/*.test.mjs
      - name: Exploration contract, library contracts with the item-queue suite on unmarked Chains (opt-in, not a product profile)
        run: cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --lib -- --test-threads=1
      - name: Exploration contract over the real stdio process (requirement links, approved revisit, old Chains unchanged; synthetic)
        run: node tools/ci/expect-tests.mjs 4 cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --test exploration_flow
      - name: Exploration Chain tool and visual-report paths over the real stdio process (declaration, evidence, citation, restart, refusals; synthetic)
        run: node tools/ci/expect-tests.mjs 4 cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --test exploration_tools
      - name: Original-record reads from a requirement over the real stdio process (reports verbatim, paged and ranged reads of large Reports, stored evidence after revisit, restart, refusals, no writes; synthetic)
        run: node tools/ci/expect-tests.mjs 6 cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --test exploration_evidence
      - name: Approval-panel responses of an exploration Chain from the real stdio process match the kept file the panel test renders (synthetic; no screen)
        run: node tools/ci/expect-tests.mjs 1 cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --test exploration_plan_panel
      - name: Closing an exploration Chain with an unanswered requirement only as approved, then the explicit next Chain (real stdio process; synthetic)
        run: node tools/ci/expect-tests.mjs 5 cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --test closing_handoff
      - name: Item-queue Chains keep their contract in an exploration build (unmarked records over the real stdio process)
        run: cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --test approved_plan_wire_wave1 --test chain_recovery_preservation --test context --test context_profiles --test guidance_wave1 --test guidance_wave2 --test guidance_interview_chain --test resume_guidance
      - name: Manual help names only the contracts the exploration build provides (Mac)
        if: runner.os == 'macOS'
        run: cargo test --locked -p gil --features exploration-flow,visual-authoring,product-safety --test manual
      - name: Compile all Core targets with the opt-in exploration contract (not a product profile)
        run: cargo build --locked -p gil --all-targets --features exploration-flow,visual-authoring,product-safety
      - name: M4-R opt-in recovery approval mode, setting parser and read-only contracts (not a product profile)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,recovery-auto-approval --lib recovery_mode
      - name: M4-R opt-in recovery approval mode over the real stdio process (5 synthetic cases, no user project)
        run: cargo test --locked -p gil --features approved-plan,visual-authoring,recovery-auto-approval --test recovery_approval_mode
      - name: Compile all Core targets with opt-in recovery approval (not a product profile)
        run: cargo build --locked -p gil --all-targets --features approved-plan,visual-authoring,recovery-auto-approval
      - name: Single end history, domain and store contracts of new format-8 projects (opt-in, not a product profile; E1–E9, forged records incl. null list keys, formats 4 and 6 preserved; synthetic)
        run: node tools/ci/expect-tests.mjs 17 cargo test --locked -p gil --features will-end-history --test will_end
      - name: Unachieved end over real files, the CLI and the stdio process (evidence and dirty gates kept, save failure, resend, restart, read surfaces; synthetic, no model evaluation)
        run: node tools/ci/expect-tests.mjs 7 cargo test --locked -p gil --features will-end-history --test will_end_session
      - name: Existing Chain, Will, context and stdio suites on format 8
        run: cargo test --locked -p gil --features will-end-history --test chains --test chain_closing --test chain_handoff --test cycles --test context --test context_profiles --test will --test walk --test resume_guidance --test mcp
      - name: End history library contracts (tool surface offers the marker only here)
        run: cargo test --locked -p gil --features will-end-history --lib -- --test-threads=1
      - name: Compile all Core targets with the opt-in end history (not a product profile)
        run: cargo build --locked -p gil --all-targets --features will-end-history
      - name: End history with the visual registry (format 9) and product safety, library contracts including the typed close
        run: cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --lib -- --test-threads=1
      - name: Format 9 unachieved end through the typed visual close over the real stdio process (null marker refused in both shapes, resend, restart; synthetic)
        run: node tools/ci/expect-tests.mjs 1 cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --test will_end_visual
      - name: Unachieved end with product safety, the failure does not approve recovery (synthetic)
        run: node tools/ci/expect-tests.mjs 7 cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --test will_end_session
      - name: Private visual creation, Chain handoff, attachments and the native MCP roundtrip on format 9 (synthetic)
        run: cargo test --locked -p gil --features will-end-history,visual-authoring,product-safety --test visual_start --test chain_resume_benchmark --test mcp --test chain_handoff --test visual_attachment
      - name: Compile all Core targets with the end history in the development product profile (not a release profile)
        run: cargo build --locked -p gil --all-targets --features will-end-history,visual-authoring,product-safety
      - name: Monitor fixtures with the end history in the approval profile (the additive will_end field is checked, the committed product fixtures stay unchanged)
        run: node tools/ci/expect-tests.mjs 2 cargo test --locked -p gil --features will-end-history,approved-plan,visual-authoring,product-safety --test chain_monitor_fixtures
      - name: Shared workflow text, Skill catalog and scenario evaluator contracts (pure Node, no Core process)
        run: node --test plugins/gil-companion-prototype/skill.test.mjs plugins/gil-companion-prototype/workflow.test.mjs tools/scenarios/proxy.test.mjs tools/scenarios/redact.test.mjs tools/scenarios/report.test.mjs tools/scenarios/rpc.test.mjs tools/scenarios/scorer-cli.test.mjs tools/scenarios/trace-score.test.mjs tools/scenarios/approval-link.test.mjs tools/scenarios/state-path.test.mjs
      - name: CI cache and ordering contracts
        run: node --test tools/ci/*.test.mjs
      - name: Manual example source and reporting contracts (no Core process)
        run: node --test tools/manual-example-check/*.test.mjs
      - name: Chain interview evaluator contracts (no model evaluation)
        run: node --test tools/chain-interview-eval/*.test.mjs
      - name: Chain interview synthetic fixture integrity
        run: node tools/chain-interview-eval/check-fixtures.mjs
      - name: Chain closing evaluator and unapproved item-split model contracts
        run: node --test tools/chain-closing-eval/*.test.mjs design-tests/approved-item-split/*.test.mjs
      - name: Chain closing synthetic fixture integrity (no model evaluation)
        run: node tools/chain-closing-eval/check.mjs fixtures
      - name: Resume measurement contracts
        run: node --test tools/chain-resume-benchmark/*.test.mjs
      - name: Context growth measurement contracts (Unix process fixtures)
        if: runner.os == 'macOS'
        run: node --test tools/chain-context-bench/*.test.mjs
      - name: Keep dependency outputs in cache after verification and artifact upload
        if: steps.build_cache.outputs.cache-hit != 'true'
        run: node tools/ci/prune-workspace-cache.mjs
