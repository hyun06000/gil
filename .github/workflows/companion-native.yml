name: Companion native build and tests (no installation)
# The Windows Companion left the product path on 2026-11-12 (single-executable decision);
# only the macOS Companion crate is still built, and only when something it depends on changes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'companion/**'
      - 'src/companion*'
      - 'src/companion*/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/ci/**'
      - '.github/workflows/companion-native.yml'
  # Seed reusable default-branch dependency caches only when their inputs change.
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'companion/Cargo.toml'
      - 'mcp-app/package-lock.json'
      - 'plugins/gil-companion-prototype/package-lock.json'
      - 'tools/ci/**'
      - '.github/workflows/companion-native.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  companion:
    name: Companion (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      GIL_COMPANION_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore locked dependencies and compiler outputs
        id: build_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24, pinned
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
            target/CACHEDIR.TAG
            target/debug
            target/aarch64-apple-darwin
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/plugin-core-build
          key: ${{ runner.os }}-${{ runner.arch }}-companion-native-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-deps-v2-${{ hashFiles('.github/workflows/companion-native.yml', 'tools/ci/prune-workspace-cache.mjs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-companion-native-${{ matrix.target || matrix.os || 'native' }}-${{ matrix.profile || inputs.runtime_profile || 'default' }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/package-lock.json') }}-
      - name: Native toolchain and icon-source verification
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target $env:GIL_COMPANION_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostTriple = ((rustc -vV | Select-String '^host: ').ToString() -replace '^host: ', '').Trim()
          if ($hostTriple -ne $env:GIL_COMPANION_TARGET) { throw "Native host required: $hostTriple" }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python companion/icons/make-icons.py --check-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build real Companion executable (never start or install the GUI)
        shell: pwsh
        run: |
          cargo build --locked -p gil-companion --target $env:GIL_COMPANION_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Companion unit tests (isolated fixtures; not Desktop UI acceptance)
        shell: pwsh
        run: |
          cargo test --locked -p gil-companion --target $env:GIL_COMPANION_TARGET -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Session discovery integration on Mac
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          cargo test --locked -p gil --features runtime-testbed --target $env:GIL_COMPANION_TARGET --test companion_discovery -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: CI cache and ordering contracts
        run: node --test tools/ci/*.test.mjs
      - name: Keep dependency outputs in cache after verification and artifact upload
        if: steps.build_cache.outputs.cache-hit != 'true'
        run: node tools/ci/prune-workspace-cache.mjs
