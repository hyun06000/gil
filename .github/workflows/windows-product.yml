name: Windows x64 signed product candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-product.yml'
      - 'companion/**'
      - 'distribution/windows/product-*'
      - 'src/bin/gil-launcher.rs'
      - 'src/command.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      build_unsigned_test_candidate:
        description: 'Build, install-test and retain an explicitly unsigned owner-acceptance candidate'
        type: boolean
        required: true
        default: false
      build_signed_candidate:
        description: 'Build, install-test and retain a signed x64 candidate (never publish a release)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read

jobs:
  contract:
    name: Product contract (no install)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Locked toolchain and dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Product contract and launcher tests
        shell: pwsh
        run: |
          node --test distribution/windows/product-install.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p gil --bin gil-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --target x86_64-pc-windows-msvc -p gil --bin gil-launcher --features product-safety
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  unsigned-test-candidate:
    name: UNSIGNED owner acceptance candidate
    needs: contract
    if: github.event_name == 'workflow_dispatch' && inputs.build_unsigned_test_candidate
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install pinned native build tools
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install tauri-cli --version 2.10.1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build explicitly unsigned current-user NSIS test candidate
        shell: pwsh
        run: ./companion/build-windows-unsigned-test.ps1
      - name: Install and exercise the exact unsigned test candidate
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target\release\bundle\nsis -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          if ($installers[0].Name -notmatch '_[0-9]+\.[0-9]+\.[0-9]+-owner\.[a-f0-9]{12}_x64-setup\.exe$') {
            throw "Owner candidate is missing its content-specific version: $($installers[0].Name)"
          }
          if ((Get-AuthenticodeSignature -LiteralPath $installers[0]).Status -ne 'NotSigned') {
            throw 'Owner-acceptance candidate must remain explicitly unsigned'
          }
          $prefix = Join-Path $env:RUNNER_TEMP 'codex-cli'
          npm install --prefix $prefix --no-audit --no-fund --ignore-scripts '@openai/codex@0.163.0-alpha.11.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $codex = @(Get-ChildItem "$prefix\node_modules\@openai\codex-win32-x64" -Recurse -File -Filter 'codex.exe')
          if ($codex.Count -ne 1) { throw "Expected one native codex.exe, found $($codex.Count)" }
          ./distribution/windows/product-e2e.ps1 -Installer $installers[0].FullName -CodexExe $codex[0].FullName -Evidence 'target/windows-product-evidence/unsigned-acceptance.json' -ExpectedSignature NotSigned -DisplayName 'GIL Companion (Unsigned Test)' -SeedLegacyRuntime
      - name: Retain unsigned owner-acceptance candidate for three days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gil-windows-x64-UNSIGNED-OWNER-TEST-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/windows-product-evidence/unsigned-acceptance.json
          if-no-files-found: error
          retention-days: 3

  signed-candidate:
    name: Signed NSIS install acceptance
    needs: contract
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_candidate
    runs-on: windows-2025
    timeout-minutes: 60
    environment: windows-product-signing
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      GIL_UPDATER_PUBLIC_KEY: ${{ secrets.GIL_UPDATER_PUBLIC_KEY }}
      GIL_UPDATER_ENDPOINT: ${{ secrets.GIL_UPDATER_ENDPOINT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.GIL_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.GIL_UPDATER_PRIVATE_KEY_PASSWORD }}
      GIL_WINDOWS_TIMESTAMP_URL: ${{ secrets.GIL_WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require release secrets without printing them
        shell: pwsh
        env:
          GIL_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.GIL_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          GIL_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GIL_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $required = @(
            'GIL_UPDATER_PUBLIC_KEY', 'GIL_UPDATER_ENDPOINT', 'TAURI_SIGNING_PRIVATE_KEY',
            'GIL_WINDOWS_TIMESTAMP_URL', 'GIL_WINDOWS_CERTIFICATE_PFX_BASE64',
            'GIL_WINDOWS_CERTIFICATE_PASSWORD'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing required secret: $name" }
          }
      - name: Install pinned native build tools
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install tauri-cli --version 2.10.1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import Authenticode certificate for this job
        id: certificate
        shell: pwsh
        env:
          GIL_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.GIL_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          GIL_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GIL_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'gil-product-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:GIL_WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:GIL_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false)
          Remove-Item -LiteralPath $path -Force
          $withKey = @($imported | Where-Object HasPrivateKey)
          if ($withKey.Count -ne 1) { throw "Expected one imported signing certificate with a private key, found $($withKey.Count)" }
          $cert = $withKey[0]
          if ($cert.NotBefore -gt (Get-Date) -or $cert.NotAfter -le (Get-Date)) { throw 'Signing certificate is not currently valid' }
          if (@($cert.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value }) -notcontains '1.3.6.1.5.5.7.3.3') {
            throw 'Certificate is not valid for code signing'
          }
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Build signed current-user NSIS and updater artifacts
        shell: pwsh
        env:
          GIL_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: ./companion/build-windows.ps1
      - name: Install and exercise the exact signed candidate
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target\release\bundle\nsis -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $signatures = @(Get-ChildItem target\release\bundle\nsis -Recurse -File -Filter '*.sig')
          if ($signatures.Count -lt 1 -or @($signatures | Where-Object Length -eq 0).Count) { throw 'Missing updater signature artifact' }
          $prefix = Join-Path $env:RUNNER_TEMP 'codex-cli'
          npm install --prefix $prefix --no-audit --no-fund --ignore-scripts '@openai/codex@0.163.0-alpha.11.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $codex = @(Get-ChildItem "$prefix\node_modules\@openai\codex-win32-x64" -Recurse -File -Filter 'codex.exe')
          if ($codex.Count -ne 1) { throw "Expected one native codex.exe, found $($codex.Count)" }
          ./distribution/windows/product-e2e.ps1 -Installer $installers[0].FullName -CodexExe $codex[0].FullName -Evidence 'target/windows-product-evidence/acceptance.json'
      - name: Remove imported certificate
        if: always() && steps.certificate.outputs.thumbprint
        shell: pwsh
        run: Remove-Item -LiteralPath "Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}" -Force -ErrorAction SilentlyContinue
      - name: Retain signed candidate and acceptance evidence (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gil-windows-x64-signed-candidate-${{ github.sha }}
          path: |
            target/release/bundle/nsis/
            target/windows-product-evidence/acceptance.json
          if-no-files-found: error
          retention-days: 3
