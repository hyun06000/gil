[package]
name = "gil"
version = "0.1.0"
edition = "2024"

# Companion 은 **따로 서 있는 crate** 다. `gil` 은 그것에 기대지 않으므로 CLI 가 Tauri·webview
# 의존성을 한 줄도 끌고 오지 않는다. `cargo build`·`cargo test` 는 여전히 `gil` 만 짓는다.
[workspace]
members = ["companion"]

[features]
# Development-only authoring surface; no default format change or migration.
visual-authoring = []
# Test-only entry points for the runtime update layers (launcher driver + synthetic MCP Core).
# Never enabled for product builds; the binary below exists only with this feature.
runtime-testbed = []

[[bin]]
name = "gil-runtime-testbed"
path = "src/bin/gil-runtime-testbed.rs"
required-features = ["runtime-testbed"]

[[bin]]
name = "gil-runtime-verify"
path = "src/bin/gil-runtime-verify.rs"
required-features = ["runtime-testbed"]

[dependencies]
base64 = "=0.22.1"
libc = "0.2.189"
notify = "8.2.0"
png = { version = "=0.18.1", default-features = false }
regex = "1"
rmcp = { version = "3.4.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Registry", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
